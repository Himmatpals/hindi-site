<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF कंप्रेसर — इंटरैक्टिव विज़ार्ड</title>
  <meta name="description" content="PDF का साइज घटाएँ — विज़ार्ड UI, क्वालिटी/DPI, ग्रेस्केल, पेज रेंज, लाइव प्रीव्यू। सब ब्राउज़र में।">
  <style>
    :root {
      --bg: #f5f7f5;
      --card: #ffffff;
      --muted: #d4d4d4;
      --accent: #16a34a; /* Green */
      --accent-2: #eab308; /* Yellow */
      --text: #1f2937;
      --text-dim: #6b7280;
      --ok: #16a34a; /* Green */
      --warn: #eab308; /* Yellow */
      --err: #dc2626; /* Red */
      --shadow: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font: 16px/1.5 system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: linear-gradient(180deg, #e6f0fa, var(--bg)); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; align-items: center; gap: 0.875rem; margin: 0.75rem 0 1.375rem; }
    header .logo { width: 2.375rem; height: 2.375rem; border-radius: 0.625rem; background: radial-gradient(120% 120% at 20% 10%, var(--accent) 0%, var(--accent-2) 70%, transparent 71%), conic-gradient(from 200deg at 60% 60%, #e5e7eb 0 60deg, var(--card) 60deg 360deg); box-shadow: 0 0 0 2px var(--muted), 0 0.625rem 1.875rem var(--shadow); }
    h1 { font-size: clamp(1.375rem, 4vw, 2rem); margin: 0; }

    .wizard { display: grid; grid-template-columns: 17.5rem 1fr; gap: 1.125rem; }
    @media (max-width: 900px) { .wizard { grid-template-columns: 1fr; } }
    .steps { background: var(--card); border: 1px solid var(--muted); border-radius: 1rem; padding: 0.625rem; box-shadow: 0 2px 8px var(--shadow); }
    .step-item { display: flex; align-items: center; gap: 0.625rem; padding: 0.75rem; border-radius: 0.75rem; cursor: pointer; color: var(--text-dim); transition: all 0.2s; }
    .step-item.active { background: linear-gradient(135deg, rgba(22,163,74,0.2), rgba(234,179,8,0.2)); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
    .step-item:hover { background: rgba(22,163,74,0.1); }
    .step-index { width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border-radius: 0.625rem; background: var(--muted); font-weight: 700; }

    .panel { background: var(--card); border: 1px solid var(--muted); border-radius: 1rem; padding: 1.125rem; min-height: 30rem; box-shadow: 0 2px 8px var(--shadow); }
    .drop { border: 2px dashed var(--muted); border-radius: 1.125rem; padding: 1.75rem; text-align: center; transition: all 0.25s; cursor: pointer; }
    .drop:hover, .drop.dragover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(22,163,74,0.15); }
    .btn { border: none; border-radius: 0.75rem; padding: 0.625rem 0.875rem; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn:hover, .btn:focus { transform: translateY(-1px); filter: brightness(1.1); outline: none; }
    .btn.secondary { background: linear-gradient(135deg, #e5e7eb, #d1d5db); color: var(--text); }
    .btn.ghost { background: transparent; border: 1px solid var(--muted); color: var(--text); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.625rem; }

    .grid { display: grid; gap: 0.875rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    label { display: flex; align-items: center; justify-content: space-between; gap: 0.875rem; background: #f9fafb; border: 1px solid var(--muted); padding: 0.75rem 0.875rem; border-radius: 0.75rem; }
    label .lbl { font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=text], input[type=number] { width: 100%; background: #f9fafb; border: 1px solid var(--muted); color: var(--text); padding: 0.625rem; border-radius: 0.625rem; }
    select { background: #f9fafb; border: 1px solid var(--muted); color: var(--text); padding: 0.625rem; border-radius: 0.625rem; }

    .switch { position: relative; display: inline-block; width: 3.125rem; height: 1.75rem; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--muted); transition: all 0.2s; border-radius: 2rem; }
    .slider:before { position: absolute; content: ""; height: 1.375rem; width: 1.375rem; left: 0.25rem; top: 0.1875rem; background: white; transition: transform 0.2s; border-radius: 50%; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(1.375rem); }

    .pulse { animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,0.6); } 70% { box-shadow: 0 0 0 0.75rem rgba(22,163,74,0); } 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); } }

    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.875rem, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
    .thumb { background: var(--card); border: 1px solid var(--muted); border-radius: 0.625rem; padding: 0.375rem; text-align: center; }
    .thumb canvas { width: 100%; height: auto; border-radius: 0.375rem; }

    .progress { height: 0.875rem; background: #e5e7eb; border: 1px solid var(--muted); border-radius: 6.25rem; overflow: hidden; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.15s; }

    .stat { display: flex; align-items: center; gap: 0.625rem; background: #f9fafb; border: 1px solid var(--muted); border-radius: 0.75rem; padding: 0.625rem 0.75rem; }
    .stat .value { font-weight: 800; }

    .k { color: var(--accent); }
    .hint { color: var(--text-dim); font-size: 0.95rem; }
    .danger { color: var(--err); font-weight: 700; }
    .success { color: var(--ok); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }

    footer { opacity: 0.8; margin-top: 1rem; font-size: 0.9rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    /* New styles for improved UI */
    .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-info-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .file-info-item { display: flex; align-items: center; gap: 5px; }
    .file-info-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .preview-canvas { max-width: 100%; border: 1px solid var(--muted); border-radius: 8px; }
    .compression-stats { display: flex; justify-content: space-between; margin: 15px 0; }
    .stat-card { flex: 1; text-align: center; padding: 15px; background: #f9fafb; border-radius: 8px; border: 1px solid var(--muted); }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 0.9rem; color: var(--text-dim); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>PDF कंप्रेसर — विज़ार्ड</h1>
        <div class="hint">निजी, तेज़ और शक्तिशाली। आपकी फ़ाइल आपके डिवाइस पर ही रहती है।</div>
      </div>
    </header>

    <div class="wizard" role="application" aria-label="PDF कंप्रेशन विज़ार्ड">
      <nav class="steps" aria-label="कदम">
        <div class="step-item active" data-step="1"><div class="step-index">1</div><div>फ़ाइल चुनें</div></div>
        <div class="step-item" data-step="2"><div class="step-index">2</div><div>विकल्प</div></div>
        <div class="step-item" data-step="3"><div class="step-index">3</div><div>प्रीव्यू व अनुमान</div></div>
        <div class="step-item" data-step="4"><div class="step-index">4</div><div>कंप्रेस व डाउनलोड</div></div>
      </nav>
      <section class="panel" id="panel"></section>
    </div>

    <footer>
      सुझाव: <span class="k">इमेज फ्लैटन</span> स्कैन/इमेज-भारी PDF के लिए सबसे छोटा साइज देता है। <span class="k">सेफ कॉपी</span> टेक्स्ट/वेक्टर सुरक्षित रखता है।
    </footer>
  </div>

  <!-- Updated PDF.js to latest version -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  
  <script>
    (function () {
      // Set PDF.js worker
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      
      const $ = (sel, el = document) => el.querySelector(sel);
      const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

      const state = {
        file: null,
        fileBytes: null,
        pdfDoc: null,
        numPages: 0,
        pagesMeta: [],
        mode: 'image',
        quality: 0.6,
        dpi: 110,
        grayscale: false,
        pageRange: 'all',
        format: 'jpeg',
        estimate: null,
        estPreviewBlob: null,
        pdfjsAvailable: true, // Assume it's available with our fix
        compressionLevel: 'balanced',
        isCompressing: false,
        abortController: null
      };

      const steps = $$('.step-item');
      steps.forEach(s => s.addEventListener('click', () => !state.isCompressing && goStep(parseInt(s.dataset.step))));
      const panel = $('#panel');

      const humanBytes = n => {
        if (n == null || n === 0) return '—';
        const units = ['B', 'KB', 'MB', 'GB'];
        let value = n;
        let unitIndex = 0;
        
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex++;
        }
        
        return `${value.toFixed(unitIndex > 0 ? 2 : 0)} ${units[unitIndex]}`;
      };

      // Step 1: File Selection
      function renderStep1() {
        setActive(1);
        panel.innerHTML = `
          <div class="grid" style="gap:1rem">
            <div class="drop" id="drop" aria-label="यहाँ PDF छोड़ें या फ़ाइल चुनें" tabindex="0">
              <h2>अपना PDF यहाँ छोड़ें</h2>
              <div class="hint">या</div>
              <div class="btn-row" style="justify-content:center;margin-top:0.625rem">
                <label class="btn pulse" for="fileInput">PDF चुनें</label>
                <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
              </div>
              <div class="hint" style="margin-top:0.75rem">आपकी फ़ाइल पूरी तरह सुरक्षित — कोई अपलोड नहीं।</div>
            </div>
            <div id="fileInfo" class="stat" style="display:none">
              <div class="file-info-row">
                <div class="file-info-item">
                  <span class="value" id="fileName"></span>
                </div>
                <div class="file-info-item">
                  <span class="file-info-badge" id="fileSize"></span>
                </div>
                <div class="file-info-item">
                  <span class="file-info-badge" id="filePages">—</span>
                </div>
                <div class="btn-row" style="margin-left:auto">
                  <button class="btn ghost" id="clearFile">हटाएँ</button>
                </div>
              </div>
            </div>
            <div id="thumbWrap" style="display:none">
              <div class="hint">त्वरित थंबनेल</div>
              <div class="thumbs" id="thumbs"></div>
            </div>
            <div id="uploadError" class="hint danger" style="display:none"></div>
            <div class="btn-row" style="justify-content:flex-end">
              <button class="btn secondary" disabled id="to2">अगला: विकल्प →</button>
            </div>
          </div>`;

        const drop = $('#drop'), fileInput = $('#fileInput'), to2 = $('#to2'), clearFile = $('#clearFile');
        
        const onFile = async f => {
          if (!f || !(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'))) {
            showError('कृपया केवल PDF फ़ाइल चुनें।');
            return;
          }
          
          try {
            state.file = f;
            state.fileBytes = await fileToBytes(f);
            $('#fileInfo').style.display = 'flex';
            $('#fileName').textContent = f.name;
            $('#fileSize').textContent = humanBytes(f.size);
            $('#uploadError').style.display = 'none';
            to2.disabled = true;

            // Try to load with PDF.js
            try {
              state.pdfDoc = await openWithPDFJS(state.fileBytes);
              state.numPages = state.pdfDoc.numPages;
              $('#filePages').textContent = `${state.numPages} पेज`;
              await renderThumbs();
              to2.disabled = false;
              $('#thumbWrap').style.display = 'block';
            } catch (err) {
              console.warn('PDF.js failed:', err);
              // Fallback to PDF-lib for page count
              await fallbackPageCount();
              if (state.numPages > 0) to2.disabled = false;
            }
          } catch (e) {
            console.error(e);
            showError('फ़ाइल पढ़ने में त्रुटि। फ़ाइल पासवर्ड-प्रोटेक्टेड या दूषित हो सकती है।');
          }
        };

        // Setup event listeners
        drop.addEventListener('dragover', e => { 
          e.preventDefault(); 
          drop.classList.add('dragover'); 
        });
        
        drop.addEventListener('dragleave', () => {
          drop.classList.remove('dragover');
        });
        
        drop.addEventListener('drop', e => {
          e.preventDefault(); 
          drop.classList.remove('dragover'); 
          if (e.dataTransfer.files.length > 0) {
            onFile(e.dataTransfer.files[0]);
          }
        });
        
        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('keydown', e => { 
          if (e.key === 'Enter' || e.key === ' ') {
            fileInput.click(); 
          }
        });
        
        fileInput.addEventListener('change', e => {
          if (e.target.files.length > 0) {
            onFile(e.target.files[0]);
          }
        });
        
        to2.addEventListener('click', () => goStep(2));
        
        if (clearFile) {
          clearFile.addEventListener('click', () => {
            state.file = state.fileBytes = state.pdfDoc = null;
            state.numPages = 0;
            state.pagesMeta = [];
            fileInput.value = '';
            renderStep1();
          });
        }

        function showError(msg) { 
          const el = $('#uploadError'); 
          el.textContent = msg; 
          el.style.display = 'block'; 
        }
      }

      async function fileToBytes(file) {
        return new Uint8Array(await file.arrayBuffer());
      }

      async function openWithPDFJS(bytes) {
        try {
          return await pdfjsLib.getDocument({ data: bytes }).promise;
        } catch (e) {
          if (e.name === 'PasswordException') {
            const pwd = prompt('यह PDF पासवर्ड-प्रोटेक्टेड है। पासवर्ड दर्ज करें:');
            if (!pwd) throw new Error('पासवर्ड नहीं दिया गया');
            return await pdfjsLib.getDocument({ data: bytes, password: pwd }).promise;
          }
          throw e;
        }
      }

      async function fallbackPageCount() {
        try {
          const doc = await PDFLib.PDFDocument.load(state.fileBytes);
          state.numPages = doc.getPageCount();
          $('#filePages').textContent = `${state.numPages} पेज`;
          $('#thumbWrap').style.display = 'none';
        } catch (e) {
          $('#uploadError').textContent = 'PDF पढ़ने में त्रुटि (पासवर्ड-प्रोटेक्टेड या दूषित?)।';
          $('#uploadError').style.display = 'block';
        }
      }

      async function renderThumbs() {
        const thumbs = $('#thumbs');
        thumbs.innerHTML = '';
        state.pagesMeta = [];
        
        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'hint';
        loadingDiv.textContent = 'थंबनेल लोड हो रहे हैं...';
        thumbs.appendChild(loadingDiv);
        
        const maxThumbs = Math.min(6, state.numPages);
        
        for (let i = 1; i <= maxThumbs; i++) {
          try {
            const page = await state.pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 0.2 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            
            await page.render({ 
              canvasContext: ctx, 
              viewport,
              intent: 'print'
            }).promise;
            
            const d = document.createElement('div');
            d.className = 'thumb';
            d.innerHTML = `<div style="font-weight:800;margin-bottom:0.375rem">पेज ${i}</div>`;
            d.appendChild(canvas);
            
            // Replace loading message with first thumbnail
            if (i === 1 && loadingDiv.parentNode) {
              loadingDiv.remove();
            }
            
            thumbs.appendChild(d);
            state.pagesMeta.push({ w: viewport.width, h: viewport.height });
          } catch (err) {
            console.error(`Error rendering thumbnail for page ${i}:`, err);
          }
        }
        
        if (state.numPages > maxThumbs) {
          const more = document.createElement('div');
          more.className = 'hint';
          more.textContent = `(+ ${state.numPages - maxThumbs} और पेज)`;
          $('#thumbWrap').appendChild(more);
        }
      }

      // Step 2: Options
      function renderStep2() {
        if (!state.file) return renderStep1();
        setActive(2);
        panel.innerHTML = `
          <div class="grid" style="gap:1rem">
            <div class="btn-row" style="justify-content:space-between;align-items:center">
              <button class="btn ghost" id="back1">← वापस</button>
              <div class="btn-row">
                <button class="btn ${state.compressionLevel === 'strong' ? 'pulse' : 'secondary'}" id="presetStrong" title="सबसे अधिक कंप्रेशन">प्रीसेट: स्ट्रॉन्ग</button>
                <button class="btn ${state.compressionLevel === 'balanced' ? 'pulse' : 'secondary'}" id="presetBalanced" title="संतुलित गुणवत्ता/साइज">प्रीसेट: बैलेंस्ड</button>
                <button class="btn ${state.compressionLevel === 'safe' ? 'pulse' : 'secondary'}" id="presetSafe" title="टेक्स्ट सुरक्षित रखें">प्रीसेट: सेफ</button>
              </div>
            </div>
            <div class="grid grid-2">
              <label>
                <div class="lbl">मोड</div>
                <select id="mode" aria-label="कंप्रेशन मोड चुनें">
                  <option value="image" ${state.pdfjsAvailable ? '' : 'disabled'}>इमेज फ्लैटन (अधिकतम कमी)</option>
                  <option value="safe">सेफ कॉपी (टेक्स्ट सुरक्षित)</option>
                </select>
              </label>
              <label>
                <div class="lbl">पेज रेंज</div>
                <input id="range" type="text" placeholder="उदा. 1-3,5,7-" value="${state.pageRange}" aria-label="पेज रेंज दर्ज करें">
              </label>
            </div>
            <div class="grid grid-3" id="imageControls" style="display:${state.mode === 'image' ? 'grid' : 'none'}">
              <label>
                <div class="lbl">JPEG क्वालिटी <span class="hint">(${Math.round(state.quality * 100)}%)</span></div>
                <input id="quality" type="range" min="0.2" max="0.95" step="0.01" value="${state.quality}" aria-label="JPEG क्वालिटी समायोजित करें">
              </label>
              <label>
                <div class="lbl">रेंडर DPI <span class="hint">(${state.dpi} dpi)</span></div>
                <input id="dpi" type="range" min="72" max="200" step="1" value="${state.dpi}" aria-label="रेंडर DPI समायोजित करें">
              </label>
              <label>
                <div class="lbl">ग्रेस्केल</div>
                <span class="switch"><input id="gray" type="checkbox" ${state.grayscale ? 'checked' : ''} aria-label="ग्रेस्केल चालू/बंद करें"><span class="slider"></span></span>
              </label>
            </div>
            <div class="stat">
              <div>मूल फ़ाइल: <span class="value">${humanBytes(state.file.size)}</span></div>
              <div>•</div>
              <div>मोड: <span class="value" id="modeTag">${state.mode === 'image' ? 'इमेज फ्लैटन' : 'सेफ कॉपी'}</span></div>
            </div>
            <div class="hint warn" id="noPdfJsNote" style="display:${state.pdfjsAvailable ? 'none' : 'block'}">नोट: PDF.js उपलब्ध नहीं — <b>इमेज फ्लैटन</b> अक्षम। <b>सेफ कॉपी</b> मोड का उपयोग करें।</div>
            <div class="btn-row" style="justify-content:flex-end">
              <button class="btn secondary" id="to1">← पीछे</button>
              <button class="btn" id="to3">अगला: प्रीव्यू →</button>
            </div>
          </div>`;

        $('#back1').addEventListener('click', () => goStep(1));
        $('#to1').addEventListener('click', () => goStep(1));
        $('#to3').addEventListener('click', () => {
          if (!validateRange(state.pageRange, state.numPages)) {
            alert('अमान्य पेज रेंज। कृपया सही प्रारूप (उदा. 1-3,5,7-) दर्ज करें।');
            return;
          }
          goStep(3);
        });

        const modeSel = $('#mode'), range = $('#range'), quality = $('#quality'), dpi = $('#dpi'), gray = $('#gray'), imageControls = $('#imageControls');
        modeSel.value = state.pdfjsAvailable ? state.mode : 'safe';
        state.mode = state.pdfjsAvailable ? state.mode : 'safe';

        modeSel.addEventListener('change', () => {
          state.mode = modeSel.value;
          $('#modeTag').textContent = state.mode === 'image' ? 'इमेज फ्लैटन' : 'सेफ कॉपी';
          imageControls.style.display = state.mode === 'image' ? 'grid' : 'none';
        });

        range.addEventListener('input', () => state.pageRange = range.value.trim());
        quality.addEventListener('input', () => {
          state.quality = parseFloat(quality.value);
          quality.previousElementSibling.querySelector('.hint').textContent = `(${Math.round(state.quality * 100)}%)`;
        });
        dpi.addEventListener('input', () => {
          state.dpi = parseInt(dpi.value, 10);
          dpi.previousElementSibling.querySelector('.hint').textContent = `(${state.dpi} dpi)`;
        });
        gray.addEventListener('change', () => state.grayscale = gray.checked);

        $('#presetStrong').addEventListener('click', () => {
          if (!state.pdfjsAvailable) return pulsateWarn();
          state.mode = 'image';
          state.compressionLevel = 'strong';
          state.quality = 0.5;
          state.dpi = 96;
          state.grayscale = true;
          updateSliders();
          pulsate('#presetStrong');
        });
        $('#presetBalanced').addEventListener('click', () => {
          if (!state.pdfjsAvailable) return pulsateWarn();
          state.mode = 'image';
          state.compressionLevel = 'balanced';
          state.quality = 0.65;
          state.dpi = 110;
          state.grayscale = false;
          updateSliders();
          pulsate('#presetBalanced');
        });
        $('#presetSafe').addEventListener('click', () => {
          state.mode = 'safe';
          state.compressionLevel = 'safe';
          updateSliders();
          pulsate('#presetSafe');
        });

        function updateSliders() {
          imageControls.style.display = state.mode === 'image' ? 'grid' : 'none';
          if (state.mode === 'image') {
            quality.value = state.quality;
            dpi.value = state.dpi;
            gray.checked = state.grayscale;
            quality.previousElementSibling.querySelector('.hint').textContent = `(${Math.round(state.quality * 100)}%)`;
            dpi.previousElementSibling.querySelector('.hint').textContent = `(${state.dpi} dpi)`;
          }
          $('#modeTag').textContent = state.mode === 'image' ? 'इमेज फ्लैटन' : 'सेफ कॉपी';
          $$('.btn[id^="preset"]').forEach(btn => btn.classList.toggle('pulse', btn.id === `preset${state.compressionLevel.charAt(0).toUpperCase() + state.compressionLevel.slice(1)}`));
        }

        function pulsate(sel) {
          const b = $(sel);
          b.classList.add('pulse');
          setTimeout(() => b.classList.remove('pulse'), 1600);
        }

        function pulsateWarn() {
          alert('इमेज मोड के लिए PDF.js आवश्यक है। कृपया यह पेज https/localhost से चलाएँ या इंटरनेट कनेक्शन जाँचें।');
        }
      }

      function validateRange(input, total) {
        if (!input || input === 'all') return true;
        const parts = input.split(/\s*,\s*/);
        for (const p of parts) {
          if (!p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/)) return false;
          const [_, a, b] = p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/);
          const start = a ? parseInt(a) : 1;
          const end = b ? parseInt(b) : total;
          if (start < 1 || end > total || start > end) return false;
        }
        return true;
      }

      // Step 3: Preview
      async function renderStep3() {
        if (!state.file) return renderStep1();
        setActive(3);
        panel.innerHTML = `
          <div class="btn-row" style="justify-content:space-between;align-items:center;margin-bottom:0.5rem">
            <button class="btn ghost" id="back2">← वापस</button>
            <button class="btn" id="to4">सब ठीक — कंप्रेस करें →</button>
          </div>
          <div class="grid grid-2" style="align-items:start">
            <div>
              <div class="hint" id="estLbl">त्वरित अनुमान बनाया जा रहा है…</div>
              <div class="compression-stats">
                <div class="stat-card">
                  <div class="stat-value">${humanBytes(state.file.size)}</div>
                  <div class="stat-label">मूल फ़ाइल</div>
                </div>
                <div class="stat-card">
                  <div class="stat-value" id="estSize">—</div>
                  <div class="stat-label">अनुमानित आउटपुट</div>
                </div>
              </div>
              <div class="hint" style="margin-top:0.375rem">*अनुमान पहले पेज और सेटिंग्स पर आधारित।</div>
              <div class="grid" style="margin-top:1rem">
                <label>
                  <div class="lbl">ग्रेस्केल प्रीव्यू</div>
                  <span class="switch"><input id="prevGray" type="checkbox" ${state.grayscale ? 'checked' : ''} aria-label="ग्रेस्केल प्रीव्यू चालू/बंद करें"><span class="slider"></span></span>
                </label>
              </div>
              <div class="hint warn" style="margin-top:0.625rem; display:${state.pdfjsAvailable ? 'none' : 'block'}">प्रीव्यू उपलब्ध नहीं (PDF.js नहीं मिला)। फिर भी कंप्रेस करें।</div>
            </div>
            <div class="preview-container">
              <div class="hint">प्रीव्यू</div>
              <canvas id="preview" class="preview-canvas"></canvas>
            </div>
          </div>`;

        $('#back2').addEventListener('click', () => goStep(2));
        $('#to4').addEventListener('click', () => goStep(4));
        $('#prevGray').addEventListener('change', e => { 
          state.grayscale = e.target.checked; 
          if (state.pdfjsAvailable) doEstimate(); 
        });

        if (state.pdfjsAvailable) await doEstimate(); 
        else $('#estLbl').textContent = 'प्रीव्यू उपलब्ध नहीं — सेफ कॉपी मोड में आगे बढ़ें';

        async function doEstimate() {
          $('#estLbl').textContent = 'अनुमान की गणना…';
          try {
            const page = await state.pdfDoc.getPage(1);
            const scale = state.dpi / 72;
            const viewport = page.getViewport({ scale });
            const can = $('#preview');
            can.width = Math.ceil(viewport.width);
            can.height = Math.ceil(viewport.height);
            const ctx = can.getContext('2d', { alpha: false });
            await page.render({ 
              canvasContext: ctx, 
              viewport,
              intent: 'print'
            }).promise;
            
            if (state.grayscale) toGrayscale(ctx, can.width, can.height);
            
            const mime = state.format === 'png' ? 'image/png' : 'image/jpeg';
            const quality = state.format === 'png' ? undefined : state.quality;
            const blob = await new Promise(res => can.toBlob(res, mime, quality));
            
            state.estPreviewBlob = blob;
            const selectedPages = parseRange(state.pageRange, state.numPages);
            const est = blob.size * selectedPages.length + 35000;
            state.estimate = est;
            $('#estSize').textContent = humanBytes(est);
            $('#estLbl').innerHTML = `मोड: <b>${state.mode === 'image' ? 'इमेज फ्लैटन' : 'सेफ कॉपी'}</b> • पेज: <b>${selectedPages.length}</b>`;
          } catch (e) {
            console.error(e);
            $('#estLbl').innerHTML = '<span class="danger">अनुमान नहीं हो सका। फिर भी कंप्रेस करें।</span>';
          }
        }
      }

      function toGrayscale(ctx, w, h) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const y = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
          d[i] = d[i + 1] = d[i + 2] = y;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      function parseRange(input, total) {
        if (!input || input === 'all') return Array.from({ length: total }, (_, i) => i + 1);
        const parts = input.split(/\s*,\s*/);
        const pages = new Set();
        for (const p of parts) {
          if (!p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/)) continue;
          let [_, a, b] = p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/);
          a = a ? parseInt(a) : 1;
          b = b ? parseInt(b) : total;
          if (a > b) [a, b] = [b, a];
          for (let i = a; i <= b; i++) if (i >= 1 && i <= total) pages.add(i);
        }
        return [...pages].sort((x, y) => x - y);
      }

      // Step 4: Compress
      async function renderStep4() {
        if (!state.file) return renderStep1();
        setActive(4);
        panel.innerHTML = `
          <div class="btn-row" style="justify-content:space-between;align-items:center;margin-bottom:0.5rem">
            <button class="btn ghost" id="back3">← वापस</button>
            <div class="hint">आपकी सेटिंग के साथ कंप्रेस करने के लिए तैयार।</div>
          </div>
          <div class="grid" style="gap:0.875rem">
            <div class="progress"><div class="bar" id="bar"></div></div>
            <div class="stat"><div>स्थिति:</div> <div class="value" id="status">प्रतीक्षा</div></div>
            <div class="stat"><div>आउटपुट:</div> <div class="value" id="outSize">—</div></div>
            <div class="btn-row" style="justify-content:flex-end">
              <button class="btn" id="go" ${state.isCompressing ? 'disabled' : ''}>${state.isCompressing ? 'कंप्रेस हो रहा है...' : 'कंप्रेस शुरू करें'}</button>
              <button class="btn secondary" id="cancel" style="display:${state.isCompressing ? 'inline-block' : 'none'}">रद्द करें</button>
            </div>
            <div id="done" style="display:none" class="success">पूर्ण! डाउनलोड स्वतः शुरू होगा। नहीं हुआ तो नीचे बटन क्लिक करें।</div>
            <div class="btn-row" style="justify-content:flex-end;display:none" id="dlRow">
              <a id="dl" class="btn" href="#" download>फिर से डाउनलोड</a>
            </div>
            <div class="hint">नोट: <b>इमेज फ्लैटन</b> पेज को इमेज में बदलता है (छोटा साइज; टेक्स्ट चयन हटाएगा)। <b>सेफ कॉपी</b> टेक्स्ट रखता है।</div>
          </div>`;

        $('#back3').addEventListener('click', () => goStep(3));
        $('#go').addEventListener('click', () => doCompress());
        $('#cancel').addEventListener('click', () => {
          state.isCompressing = false;
          if (state.abortController) {
            state.abortController.abort();
          }
          renderStep4();
        });

        async function doCompress() {
          if (state.isCompressing) return;
          state.isCompressing = true;
          state.abortController = new AbortController();
          renderStep4();
          
          const status = $('#status'), bar = $('#bar'), outSize = $('#outSize');
          const pages = parseRange(state.pageRange, state.numPages);
          const t0 = performance.now();
          
          try {
            status.textContent = 'तैयारी…';
            const { PDFDocument } = PDFLib;
            
            if (state.mode === 'safe') {
              const src = await PDFDocument.load(state.fileBytes);
              const out = await PDFDocument.create();
              const copied = await out.copyPages(src, pages.map(n => n - 1));
              copied.forEach(p => out.addPage(p));
              const bytes = await out.save({ useObjectStreams: true, addDefaultPage: false });
              finish(new Blob([bytes], { type: 'application/pdf' }));
            } else {
              if (!state.pdfjsAvailable) {
                status.innerHTML = '<span class="danger">इमेज मोड के लिए PDF.js आवश्यक है। कृपया यह पेज https/localhost से चलाएँ।</span>';
                state.isCompressing = false;
                renderStep4();
                return;
              }
              
              const out = await PDFDocument.create();
              let i = 0;
              
              for (const n of pages) {
                // Check for cancellation
                if (state.abortController.signal.aborted) {
                  throw new Error('कंप्रेशन रद्द किया गया');
                }
                
                status.textContent = `रेंडरिंग पेज ${n}/${pages.length}…`;
                const page = await state.pdfDoc.getPage(n);
                const scale = state.dpi / 72;
                const viewport = page.getViewport({ scale });
                const can = document.createElement('canvas');
                can.width = Math.ceil(viewport.width);
                can.height = Math.ceil(viewport.height);
                const ctx = can.getContext('2d', { alpha: false });
                
                await page.render({ 
                  canvasContext: ctx, 
                  viewport,
                  intent: 'print'
                }).promise;
                
                if (state.grayscale) toGrayscale(ctx, can.width, can.height);
                
                const mime = state.format === 'png' ? 'image/png' : 'image/jpeg';
                const quality = state.format === 'png' ? undefined : state.quality;
                const imgBlob = await new Promise(res => can.toBlob(res, mime, quality));
                const imgBytes = new Uint8Array(await imgBlob.arrayBuffer());
                
                let img;
                if (state.format === 'png') img = await out.embedPng(imgBytes);
                else img = await out.embedJpg(imgBytes);
                
                const pageOut = out.addPage([can.width, can.height]);
                pageOut.drawImage(img, { x: 0, y: 0, width: can.width, height: can.height });
                i++;
                bar.style.width = `${Math.round((i / pages.length) * 100)}%`;
              }
              
              status.textContent = 'PDF लिखना…';
              const bytes = await out.save({ useObjectStreams: true, addDefaultPage: false });
              finish(new Blob([bytes], { type: 'application/pdf' }));
            }
          } catch (e) {
            console.error(e);
            status.innerHTML = `<span class="danger">त्रुटि: ${e.message || 'कंप्रेशन विफल'}</span>`;
            state.isCompressing = false;
            renderStep4();
          }

          function finish(blob) {
            state.isCompressing = false;
            const dt = (performance.now() - t0) / 1000;
            $('#done').style.display = 'block';
            const name = (state.file.name || 'document').replace(/\.pdf$/i, '');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.compressed.pdf`;
            a.click();
            $('#dl').href = url;
            $('#dl').download = `${name}.compressed.pdf`;
            $('#dlRow').style.display = 'flex';
            outSize.textContent = `${humanBytes(blob.size)} • ${dt.toFixed(1)}s`;
            status.innerHTML = '<span class="success">सम्पन्न</span>';
            renderStep4();
          }
        }
      }

      function setActive(step) {
        steps.forEach(el => el.classList.toggle('active', parseInt(el.dataset.step) === step));
      }

      function goStep(n) {
        switch (n) {
          case 1: renderStep1(); break;
          case 2: renderStep2(); break;
          case 3: renderStep3(); break;
          case 4: renderStep4(); break;
        }
      }

      // Initialize
      goStep(1);
    })();
  </script>
</body>
</html>
