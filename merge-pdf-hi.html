<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const { PDFDocument, degrees } = PDFLib;
const $ = id => document.getElementById(id);

const COLORS = [
  "#43dcff",
  "#ff8a3d",
  "#37e88c",
  "#b48cff",
  "#ffd166",
  "#ff6d9d",
  "#65a7ff",
  "#4ee0c1"
];

const BLANK_SIZES = {
  a4: [595.28, 841.89],
  letter: [612, 792],
  legal: [612, 1008],
  a3: [841.89, 1190.55]
};

/* =========================================================
   STATE
========================================================= */

const state = {
  files: new Map(),

  /* Only active sources appear here.
     Removed sources remain in files so Undo can restore them. */
  fileOrder: [],

  assembly: [],
  selected: new Set(),

  history: [],
  redoHistory: [],

  currentUrl: null,

  observer: null,

  /*
    Every complete card rebuild gets a new generation.
    Old thumbnail jobs are not allowed to write into the new DOM.
  */
  renderGeneration: 0,

  rendering: new Map(),

  busy: false,

  lastSelectedUid: null,

  statusTimer: null
};

/* =========================================================
   DOM
========================================================= */

const fileInput = $("fileInput");
const dropzone = $("dropzone");
const workspace = $("workspace");

const sourceList = $("sourceList");

const pagesGrid = $("pagesGrid");
const pagesViewport = $("pagesViewport");

const mergeBtn = $("mergeBtn");

const statusPanel = $("statusPanel");
const statusLine = $("statusLine");
const progressBar = $("progressBar");

const resultPanel = $("resultPanel");
const resultText = $("resultText");
const downloadLink = $("downloadLink");

const previewModal = $("previewModal");
const modalBody = $("modalBody");
const previewTitle = $("previewTitle");

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix = "id") {
  return (
    prefix +
    "-" +
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).slice(2, 10)
  );
}

function formatBytes(bytes) {
  if (!bytes) return "0 Bytes";

  const k = 1024;
  const units = ["Bytes", "KB", "MB", "GB"];

  const i = Math.min(
    units.length - 1,
    Math.floor(Math.log(bytes) / Math.log(k))
  );

  return (
    parseFloat(
      (bytes / Math.pow(k, i)).toFixed(2)
    ) +
    " " +
    units[i]
  );
}

function safeName(value) {
  return (
    (value || "merged-pdf")
      .replace(/\.pdf$/i, "")
      .replace(/[^\u0900-\u097Fa-zA-Z0-9-_ ]/g, "")
      .trim()
      .replace(/\s+/g, "-") ||
    "merged-pdf"
  );
}

function escapeHtml(value) {
  return String(value).replace(
    /[&<>"']/g,
    ch =>
      ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[ch]
  );
}

function clearStatusTimer() {
  if (state.statusTimer) {
    clearTimeout(state.statusTimer);
    state.statusTimer = null;
  }
}

function setStatus(message, type = "normal", percent = null) {
  clearStatusTimer();

  statusPanel.classList.add("show");

  statusLine.textContent = message;
  statusLine.className = "status-line";

  if (type !== "normal") {
    statusLine.classList.add(type);
  }

  if (percent !== null) {
    progressBar.style.width =
      Math.max(0, Math.min(100, percent)) + "%";
  }
}

function flashStatus(
  message,
  type = "normal",
  percent = 100,
  delay = 1100
) {
  setStatus(message, type, percent);

  state.statusTimer = setTimeout(() => {
    if (!state.busy) {
      clearStatus();
    }
  }, delay);
}

function clearStatus() {
  clearStatusTimer();

  statusPanel.classList.remove("show");
  statusLine.textContent = "";
  progressBar.style.width = "0%";
}

function clearResult() {
  resultPanel.classList.remove("show");

  if (state.currentUrl) {
    URL.revokeObjectURL(state.currentUrl);
    state.currentUrl = null;
  }

  downloadLink.href = "#";
  downloadLink.removeAttribute("download");
}

function cloneAssembly() {
  return state.assembly.map(item => ({
    ...item,

    pageSize: Array.isArray(item.pageSize)
      ? [...item.pageSize]
      : item.pageSize
  }));
}

function activeFiles() {
  return state.fileOrder
    .map(id => state.files.get(id))
    .filter(Boolean);
}

function includedItems() {
  return state.assembly.filter(item => item.included);
}

function sourceColor(fileId) {
  const index = state.fileOrder.indexOf(fileId);

  return COLORS[
    (index < 0 ? 0 : index) % COLORS.length
  ];
}

function sourceLabel(fileId) {
  const index = state.fileOrder.indexOf(fileId);

  return index >= 0
    ? "PDF " + (index + 1)
    : "PDF";
}

/* =========================================================
   HISTORY
========================================================= */

function captureSnapshot() {
  return {
    assembly: cloneAssembly(),

    fileOrder: [...state.fileOrder],

    selected: [...state.selected],

    lastSelectedUid: state.lastSelectedUid
  };
}

function snapshot() {
  state.history.push(captureSnapshot());

  if (state.history.length > 50) {
    state.history.shift();
  }

  state.redoHistory = [];
}

function restoreSnapshot(saved) {
  /*
    Source records are retained in state.files,
    so removing a source is now genuinely undoable.
  */

  state.fileOrder = saved.fileOrder.filter(id =>
    state.files.has(id)
  );

  state.assembly = saved.assembly
    .filter(
      item =>
        item.blank ||
        state.files.has(item.fileId)
    )
    .map(item => ({
      ...item,

      pageSize: Array.isArray(item.pageSize)
        ? [...item.pageSize]
        : item.pageSize
    }));

  const validIds = new Set(
    state.assembly.map(item => item.uid)
  );

  state.selected = new Set(
    saved.selected.filter(id => validIds.has(id))
  );

  state.lastSelectedUid =
    validIds.has(saved.lastSelectedUid)
      ? saved.lastSelectedUid
      : null;

  clearResult();

  renderSources();
  renderAssembly();

  workspace.classList.toggle(
    "show",
    state.fileOrder.length > 0 ||
      state.assembly.length > 0
  );
}

function undo() {
  if (state.busy) return;

  const previous = state.history.pop();

  if (!previous) {
    flashStatus(
      "Undo के लिए previous change नहीं है.",
      "warning",
      0
    );
    return;
  }

  state.redoHistory.push(
    captureSnapshot()
  );

  if (state.redoHistory.length > 50) {
    state.redoHistory.shift();
  }

  restoreSnapshot(previous);

  flashStatus(
    "Last change undo किया गया.",
    "success"
  );
}

function redo() {
  if (state.busy) return;

  const next = state.redoHistory.pop();

  if (!next) {
    flashStatus(
      "Redo के लिए next change नहीं है.",
      "warning",
      0
    );
    return;
  }

  state.history.push(
    captureSnapshot()
  );

  if (state.history.length > 50) {
    state.history.shift();
  }

  restoreSnapshot(next);

  flashStatus(
    "Change redo किया गया.",
    "success"
  );
}

/* =========================================================
   TELEMETRY
========================================================= */

function includedOrderMap() {
  let number = 0;

  const map = new Map();

  state.assembly.forEach(item => {
    if (item.included) {
      map.set(
        item.uid,
        ++number
      );
    }
  });

  return map;
}

function updateTelemetry() {
  $("teleFiles").textContent =
    state.fileOrder.length;

  $("teleTotal").textContent =
    state.assembly.filter(
      item => !item.blank
    ).length;

  $("teleIncluded").textContent =
    includedItems().length;

  $("teleSelected").textContent =
    state.selected.size;

  const totalSize =
    activeFiles().reduce(
      (sum, record) =>
        sum + (record.file?.size || 0),
      0
    );

  $("teleSize").textContent =
    formatBytes(totalSize);
}

function updateSummary() {
  const count = includedItems().length;

  $("assemblyCount").textContent =
    count +
    (count === 1
      ? " page in output"
      : " pages in output");

  $("selectionDetail").textContent =
    state.selected.size
      ? state.selected.size +
        " card(s) selected for batch actions."
      : "Tap a card to select it. Green ✓ controls whether it goes into final PDF.";

  mergeBtn.disabled =
    state.busy ||
    count === 0;

  updateTelemetry();
}

function setBusy(value) {
  state.busy = value;

  mergeBtn.disabled =
    value ||
    includedItems().length === 0;

  $("renderAllBtn").disabled = value;
  $("addMoreBtn").disabled = value;
  $("chooseFilesBtn").disabled = value;
}

/* =========================================================
   PDF COMPATIBILITY CHECK
========================================================= */

async function inspectPdfWithPdfLib(buffer) {
  try {
    const doc =
      await PDFDocument.load(
        buffer.slice(0),
        {
          ignoreEncryption: false
        }
      );

    return {
      mergeMode: "copy",

      pdfLibPageCount:
        doc.getPageCount(),

      mergeWarning: null
    };
  } catch (error) {
    /*
      Important:
      PDF.js may still be able to display this PDF.

      Instead of rejecting it completely,
      we keep it and later rasterise the page
      into the output PDF.
    */

    return {
      mergeMode: "raster",

      pdfLibPageCount: null,

      mergeWarning:
        error?.message ||
        "Direct PDF page copy unavailable"
    };
  }
}

/* =========================================================
   ADD FILES
========================================================= */

async function addFiles(fileList) {
  if (state.busy) return;

  clearResult();
  clearStatus();

  const incoming = [
    ...(fileList || [])
  ].filter(
    file =>
      file.type === "application/pdf" ||
      file.name
        .toLowerCase()
        .endsWith(".pdf")
  );

  if (!incoming.length) {
    setStatus(
      "कृपया PDF files चुनें.",
      "error",
      0
    );

    return;
  }

  dropzone.classList.add("scanning");

  let added = 0;
  let failed = 0;
  let duplicates = 0;
  let historyTaken = false;

  try {
    for (
      let index = 0;
      index < incoming.length;
      index++
    ) {
      const file = incoming[index];

      const duplicate =
        state.fileOrder.some(id => {
          const record =
            state.files.get(id);

          return (
            record &&
            record.file.name ===
              file.name &&
            record.file.size ===
              file.size &&
            record.file
              .lastModified ===
              file.lastModified
          );
        });

      if (duplicate) {
        duplicates++;
        continue;
      }

      try {
        setStatus(
          `PDF ${index + 1} / ${
            incoming.length
          } analyse हो रही है…`,
          "normal",
          Math.round(
            (index /
              incoming.length) *
              50
          )
        );

        const buffer =
          await file.arrayBuffer();

        /*
          PDF.js decides whether we can actually
          display the PDF.
        */

        const loadingTask =
          pdfjsLib.getDocument({
            data: buffer.slice(0),
            stopAtErrors: false
          });

        const pdfJs =
          await loadingTask.promise;

        /*
          Separately check whether pdf-lib
          can directly copy its pages.
        */

        const compatibility =
          await inspectPdfWithPdfLib(
            buffer
          );

        if (!historyTaken) {
          snapshot();
          historyTaken = true;
        }

        const fileId =
          uid("file");

        state.files.set(
          fileId,
          {
            id: fileId,

            file,

            buffer,

            pdfJs,

            pageCount:
              pdfJs.numPages,

            mergeMode:
              compatibility.mergeMode,

            mergeWarning:
              compatibility.mergeWarning,

            pdfLibPageCount:
              compatibility.pdfLibPageCount
          }
        );

        state.fileOrder.push(
          fileId
        );

        for (
          let pageNo = 1;
          pageNo <=
          pdfJs.numPages;
          pageNo++
        ) {
          state.assembly.push({
            uid: uid("page"),

            fileId,

            pageNo,

            rotation: 0,

            included: true,

            blank: false
          });
        }

        added++;
      } catch (error) {
        console.error(
          "PDF load failed:",
          file.name,
          error
        );

        failed++;
      }
    }
  } finally {
    dropzone.classList.remove(
      "scanning"
    );
  }

  renderSources();
  renderAssembly();

  workspace.classList.toggle(
    "show",
    state.fileOrder.length > 0 ||
      state.assembly.length > 0
  );

  const messages = [
    `${added} PDF add हुई`
  ];

  if (duplicates) {
    messages.push(
      `${duplicates} duplicate skip`
    );
  }

  if (failed) {
    messages.push(
      `${failed} read failed`
    );
  }

  flashStatus(
    messages.join(" • "),
    failed
      ? "warning"
      : "success",
    100,
    1400
  );

  if (added) {
    workspace.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}

/* =========================================================
   SOURCE CARDS
========================================================= */

function renderSources() {
  sourceList.innerHTML = "";

  state.fileOrder.forEach(
    (fileId, index) => {
      const record =
        state.files.get(fileId);

      if (!record) return;

      const cards =
        state.assembly.filter(
          item =>
            item.fileId === fileId
        );

      const used =
        cards.filter(
          item => item.included
        ).length;

      const total =
        cards.length;

      const sourceStateClass =
        used === 0
          ? "none"
          : used === total
          ? ""
          : "partial";

      const sourceStateText =
        used === 0
          ? "Excluded from output"
          : used === total
          ? "All source pages included"
          : `${used} of ${total} included`;

      const compatibilityText =
        record.mergeMode === "copy"
          ? "Direct merge ready"
          : "Compatibility mode: visual merge";

      const compatibilityColor =
        record.mergeMode === "copy"
          ? "var(--green)"
          : "var(--yellow)";

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "source-card";

      card.dataset.fileId =
        fileId;

      card.style.setProperty(
        "--source",
        sourceColor(fileId)
      );

      card.innerHTML = `
        <div class="source-head">
          <span class="source-badge">${
            index + 1
          }</span>

          <span class="source-info">

            <strong title="${escapeHtml(
              record.file.name
            )}">
              ${escapeHtml(
                record.file.name
              )}
            </strong>

            <span class="source-meta">
              ${
                record.pageCount
              } pages •
              ${formatBytes(
                record.file.size
              )} •
              ${used} used
            </span>

            <span class="source-include-state ${sourceStateClass}">
              <i></i>
              ${sourceStateText}
            </span>

            <span style="color:${compatibilityColor}">
              ${compatibilityText}
            </span>

          </span>
        </div>

        <div class="source-actions">

          <button
            class="mini focus"
            type="button">
            Show
          </button>

          <button
            class="mini include-source"
            type="button">
            Use all
          </button>

          <button
            class="mini exclude-source"
            type="button">
            Use none
          </button>

          <button
            class="mini only"
            type="button">
            Use only this
          </button>

          <button
            class="mini select-source"
            type="button">
            Select cards
          </button>

          <button
            class="mini reverse"
            type="button">
            Reverse pages
          </button>

          <button
            class="danger remove-source"
            type="button">
            Remove
          </button>

        </div>
      `;

      card.querySelector(
        ".focus"
      ).onclick = () =>
        focusFile(fileId);

      card.querySelector(
        ".include-source"
      ).onclick = () =>
        setSourceIncluded(
          fileId,
          true
        );

      card.querySelector(
        ".exclude-source"
      ).onclick = () =>
        setSourceIncluded(
          fileId,
          false
        );

      card.querySelector(
        ".only"
      ).onclick = () => {
        if (state.busy) return;

        snapshot();

        state.assembly.forEach(
          item => {
            item.included =
              item.fileId ===
              fileId;
          }
        );

        clearResult();

        renderSources();
        renderAssembly();
      };

      card.querySelector(
        ".select-source"
      ).onclick = () =>
        selectSourceCards(
          fileId
        );

      card.querySelector(
        ".reverse"
      ).onclick = () =>
        reverseFilePages(
          fileId
        );

      card.querySelector(
        ".remove-source"
      ).onclick = () =>
        removeSource(fileId);

      sourceList.appendChild(
        card
      );
    }
  );
}

function refreshSourceCounters() {
  sourceList
    .querySelectorAll(
      ".source-card"
    )
    .forEach(card => {
      const fileId =
        card.dataset.fileId;

      const record =
        state.files.get(fileId);

      if (!record) return;

      const sourcePages =
        state.assembly.filter(
          item =>
            item.fileId ===
            fileId
        );

      const used =
        sourcePages.filter(
          item => item.included
        ).length;

      const total =
        sourcePages.length;

      const meta =
        card.querySelector(
          ".source-meta"
        );

      if (meta) {
        meta.textContent =
          `${record.pageCount} pages • ` +
          `${formatBytes(
            record.file.size
          )} • ` +
          `${used} used`;
      }

      const includeState =
        card.querySelector(
          ".source-include-state"
        );

      if (includeState) {
        let className =
          "source-include-state";

        let text =
          "All source pages included";

        if (used === 0) {
          className += " none";
          text =
            "Excluded from output";
        } else if (
          used !== total
        ) {
          className +=
            " partial";

          text =
            `${used} of ${total} included`;
        }

        includeState.className =
          className;

        includeState.innerHTML =
          `<i></i>${text}`;
      }
    });
}

function setSourceIncluded(
  fileId,
  included
) {
  if (state.busy) return;

  snapshot();

  state.assembly.forEach(
    item => {
      if (
        item.fileId === fileId
      ) {
        item.included =
          included;
      }
    }
  );

  clearResult();

  renderAssembly();
}

function selectSourceCards(
  fileId
) {
  state.selected =
    new Set(
      state.assembly
        .filter(
          item =>
            item.fileId ===
            fileId
        )
        .map(item => item.uid)
    );

  refreshCardStates();

  focusFile(fileId);
}

function focusFile(fileId) {
  const card =
    pagesGrid.querySelector(
      `.page-card[data-file="${fileId}"]`
    );

  if (!card) return;

  card.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

  if (
    typeof card.animate ===
    "function"
  ) {
    card.animate(
      [
        {
          boxShadow:
            "0 0 0 0 rgba(67,220,255,0)"
        },
        {
          boxShadow:
            "0 0 0 5px rgba(67,220,255,.35)"
        },
        {
          boxShadow:
            "0 0 0 0 rgba(67,220,255,0)"
        }
      ],
      {
        duration: 900
      }
    );
  }
}

function reverseFilePages(
  fileId
) {
  if (state.busy) return;

  const positions = [];
  const items = [];

  state.assembly.forEach(
    (item, index) => {
      if (
        item.fileId === fileId
      ) {
        positions.push(index);
        items.push(item);
      }
    }
  );

  if (items.length < 2) {
    return;
  }

  snapshot();

  items.reverse();

  positions.forEach(
    (position, index) => {
      state.assembly[
        position
      ] = items[index];
    }
  );

  clearResult();

  renderAssembly();

  flashStatus(
    "इस PDF के pages reverse कर दिए गए.",
    "success"
  );
}

function removeSource(fileId) {
  if (state.busy) return;

  if (
    !state.fileOrder.includes(
      fileId
    )
  ) {
    return;
  }

  snapshot();

  /*
    Do NOT destroy/delete the source record here.

    That was one of the old bugs:
    Undo restored page cards but the actual PDF had already gone.
  */

  state.fileOrder =
    state.fileOrder.filter(
      id => id !== fileId
    );

  const removedIds =
    new Set(
      state.assembly
        .filter(
          item =>
            item.fileId ===
            fileId
        )
        .map(item => item.uid)
    );

  state.assembly =
    state.assembly.filter(
      item =>
        item.fileId !==
        fileId
    );

  state.selected =
    new Set(
      [...state.selected].filter(
        id =>
          !removedIds.has(id)
      )
    );

  if (
    removedIds.has(
      state.lastSelectedUid
    )
  ) {
    state.lastSelectedUid =
      null;
  }

  clearResult();

  renderSources();
  renderAssembly();

  workspace.classList.toggle(
    "show",
    state.fileOrder.length > 0 ||
      state.assembly.length > 0
  );
}

/* =========================================================
   PAGE CARDS
========================================================= */

function createCard(
  item,
  orderMap
) {
  const card =
    document.createElement(
      "article"
    );

  card.className =
    "page-card";

  card.dataset.uid =
    item.uid;

  if (item.fileId) {
    card.dataset.file =
      item.fileId;
  }

  card.draggable =
    !state.busy;

  card.style.setProperty(
    "--source",
    item.blank
      ? "#9aaab2"
      : sourceColor(
          item.fileId
        )
  );

  card.classList.toggle(
    "selected",
    state.selected.has(
      item.uid
    )
  );

  card.classList.toggle(
    "excluded",
    !item.included
  );

  const label =
    item.blank
      ? "BLANK"
      : sourceLabel(
          item.fileId
        );

  const pageText =
    item.blank
      ? "Blank page"
      : "Page " +
        item.pageNo;

  const outputNo =
    orderMap.get(
      item.uid
    );

  const blankMeta =
    item.blank &&
    item.blankSize
      ? `<span class="blank-dimensions">${
          item.blankSize.toUpperCase()
        } · ${
          item.orientation ||
          "portrait"
        }</span>`
      : "";

  card.innerHTML = `

    <div class="thumb-shell">

      ${
        item.blank
          ? '<div class="blank-sheet">BLANK PAGE</div>'
          : '<div class="placeholder">Loading thumbnail…</div>'
      }

    </div>

    <button
      class="include-box"
      type="button"
      aria-label="Include or exclude">

      ${
        item.included
          ? "✓"
          : ""
      }

    </button>

    <div class="source-tag">
      ${label}
    </div>

    ${
      outputNo
        ? `<div class="order-badge">
             OUT ${String(
               outputNo
             ).padStart(
               2,
               "0"
             )}
           </div>`
        : ""
    }

    <div class="page-meta">

      <span>
        ${pageText}
        ${blankMeta}
      </span>

      <span class="page-actions">

        ${
          item.blank
            ? ""
            : `<button
                 class="page-action preview"
                 type="button"
                 title="Preview">
                 ⌕
               </button>`
        }

        <button
          class="page-action move-left"
          type="button"
          title="Move left">
          ←
        </button>

        <button
          class="page-action move-right"
          type="button"
          title="Move right">
          →
        </button>

        <button
          class="page-action rotate"
          type="button"
          title="Rotate">
          ↻
        </button>

        <button
          class="page-action duplicate"
          type="button"
          title="Duplicate">
          ⧉
        </button>

        <button
          class="page-action remove"
          type="button"
          title="Remove">
          ×
        </button>

      </span>
    </div>
  `;

  /* -------- Selection -------- */

  card.addEventListener(
    "click",
    event => {
      if (
        state.busy ||
        event.target.closest(
          "button"
        )
      ) {
        return;
      }

      const currentIndex =
        state.assembly.findIndex(
          entry =>
            entry.uid ===
            item.uid
        );

      if (
        event.shiftKey &&
        state.lastSelectedUid
      ) {
        const anchorIndex =
          state.assembly.findIndex(
            entry =>
              entry.uid ===
              state.lastSelectedUid
          );

        if (
          anchorIndex >= 0 &&
          currentIndex >= 0
        ) {
          const start =
            Math.min(
              anchorIndex,
              currentIndex
            );

          const end =
            Math.max(
              anchorIndex,
              currentIndex
            );

          for (
            let i = start;
            i <= end;
            i++
          ) {
            state.selected.add(
              state.assembly[i]
                .uid
            );
          }
        }
      } else {
        if (
          state.selected.has(
            item.uid
          )
        ) {
          state.selected.delete(
            item.uid
          );
        } else {
          state.selected.add(
            item.uid
          );
        }

        state.lastSelectedUid =
          item.uid;
      }

      refreshCardStates();
    }
  );

  /* -------- Include -------- */

  card.querySelector(
    ".include-box"
  ).onclick = event => {
    event.stopPropagation();

    if (state.busy) return;

    snapshot();

    item.included =
      !item.included;

    clearResult();

    renderAssembly();
  };

  /* -------- Move -------- */

  card.querySelector(
    ".move-left"
  ).onclick = event => {
    event.stopPropagation();

    moveOne(
      item.uid,
      -1
    );
  };

  card.querySelector(
    ".move-right"
  ).onclick = event => {
    event.stopPropagation();

    moveOne(
      item.uid,
      1
    );
  };

  /* -------- Rotate -------- */

  card.querySelector(
    ".rotate"
  ).onclick = event => {
    event.stopPropagation();

    if (state.busy) return;

    snapshot();

    item.rotation =
      (item.rotation + 90) %
      360;

    clearResult();

    renderAssembly();
  };

  /* -------- Duplicate -------- */

  card.querySelector(
    ".duplicate"
  ).onclick = event => {
    event.stopPropagation();

    duplicateOne(
      item.uid
    );
  };

  /* -------- Delete -------- */

  card.querySelector(
    ".remove"
  ).onclick = event => {
    event.stopPropagation();

    removeOne(
      item.uid
    );
  };

  /* -------- Preview -------- */

  const previewButton =
    card.querySelector(
      ".preview"
    );

  if (previewButton) {
    previewButton.onclick =
      async event => {
        event.stopPropagation();

        await showPreview(
          item
        );
      };
  }

  /* -------- Drag reorder -------- */

  card.addEventListener(
    "dragstart",
    event => {
      if (state.busy) {
        event.preventDefault();
        return;
      }

      card.classList.add(
        "dragging"
      );

      event.dataTransfer.setData(
        "text/plain",
        item.uid
      );

      event.dataTransfer.effectAllowed =
        "move";
    }
  );

  card.addEventListener(
    "dragend",
    () => {
      card.classList.remove(
        "dragging"
      );

      pagesGrid
        .querySelectorAll(
          ".page-card"
        )
        .forEach(entry =>
          entry.classList.remove(
            "drop-target"
          )
        );
    }
  );

  card.addEventListener(
    "dragover",
    event => {
      if (state.busy) return;

      event.preventDefault();

      card.classList.add(
        "drop-target"
      );

      event.dataTransfer.dropEffect =
        "move";
    }
  );

  card.addEventListener(
    "dragleave",
    () => {
      card.classList.remove(
        "drop-target"
      );
    }
  );

  card.addEventListener(
    "drop",
    event => {
      if (state.busy) return;

      event.preventDefault();

      card.classList.remove(
        "drop-target"
      );

      const dragged =
        event.dataTransfer.getData(
          "text/plain"
        );

      if (
        !dragged ||
        dragged === item.uid
      ) {
        return;
      }

      const from =
        state.assembly.findIndex(
          entry =>
            entry.uid ===
            dragged
        );

      const to =
        state.assembly.findIndex(
          entry =>
            entry.uid ===
            item.uid
        );

      if (
        from < 0 ||
        to < 0
      ) {
        return;
      }

      snapshot();

      const [moved] =
        state.assembly.splice(
          from,
          1
        );

      state.assembly.splice(
        to,
        0,
        moved
      );

      clearResult();

      renderAssembly();
    }
  );

  return card;
}

/* =========================================================
   ASSEMBLY RENDER
========================================================= */

function renderAssembly() {
  /*
    This is the important thumbnail fix.

    Every rebuild gets a new generation.
    An old render task cannot mark a replacement card as complete.
  */

  state.renderGeneration++;

  const generation =
    state.renderGeneration;

  if (state.observer) {
    state.observer.disconnect();
    state.observer = null;
  }

  state.rendering.clear();

  pagesGrid.innerHTML = "";

  const orderMap =
    includedOrderMap();

  state.assembly.forEach(
    item => {
      pagesGrid.appendChild(
        createCard(
          item,
          orderMap
        )
      );
    }
  );

  setupObserver(
    generation
  );

  refreshSourceCounters();

  updateSummary();
}

function refreshCardStates() {
  pagesGrid
    .querySelectorAll(
      ".page-card"
    )
    .forEach(card => {
      const item =
        state.assembly.find(
          entry =>
            entry.uid ===
            card.dataset.uid
        );

      if (!item) return;

      card.classList.toggle(
        "selected",
        state.selected.has(
          item.uid
        )
      );

      card.classList.toggle(
        "excluded",
        !item.included
      );
    });

  updateSummary();
}

/* =========================================================
   THUMBNAILS
========================================================= */

function getPdfJsRotation(
  page,
  itemRotation
) {
  return (
    (Number(page.rotate) || 0) +
    (Number(itemRotation) ||
      0) +
    360
  ) % 360;
}

async function renderThumb(
  item,
  options = {}
) {
  if (item.blank) return;

  const generation =
    options.generation ??
    state.renderGeneration;

  const force =
    options.force === true;

  const record =
    state.files.get(
      item.fileId
    );

  if (!record) return;

  /*
    Prevent duplicate render for the same card
    inside the same generation.
  */

  if (
    state.rendering.get(
      item.uid
    ) === generation
  ) {
    return;
  }

  const card =
    pagesGrid.querySelector(
      `.page-card[data-uid="${item.uid}"]`
    );

  if (!card) return;

  const shell =
    card.querySelector(
      ".thumb-shell"
    );

  if (!shell) return;

  state.rendering.set(
    item.uid,
    generation
  );

  try {
    if (force) {
      shell.innerHTML =
        '<div class="placeholder">Rendering…</div>';
    }

    const page =
      await record.pdfJs.getPage(
        item.pageNo
      );

    const rotation =
      getPdfJsRotation(
        page,
        item.rotation
      );

    /*
      Rotation is applied by PDF.js itself now,
      not CSS.

      That means portrait ↔ landscape dimensions
      are genuinely recalculated.
    */

    const base =
      page.getViewport({
        scale: 1,
        rotation
      });

    const target =
      Math.max(
        120,
        Number(
          $("thumbZoom").value
        ) - 12
      );

    const scale =
      Math.min(
        1.15,
        target /
          Math.max(
            1,
            base.width
          )
      );

    const viewport =
      page.getViewport({
        scale,
        rotation
      });

    const canvas =
      document.createElement(
        "canvas"
      );

    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );

    canvas.width =
      Math.max(
        1,
        Math.ceil(
          viewport.width
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.ceil(
          viewport.height
        )
      );

    context.fillStyle =
      "#ffffff";

    context.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    await page.render({
      canvasContext:
        context,

      viewport,

      background:
        "rgb(255,255,255)"
    }).promise;

    /*
      If the page grid was rebuilt while this
      async render was running, discard it.
    */

    if (
      generation !==
      state.renderGeneration
    ) {
      return;
    }

    const liveCard =
      pagesGrid.querySelector(
        `.page-card[data-uid="${item.uid}"]`
      );

    if (
      !liveCard ||
      !liveCard.isConnected
    ) {
      return;
    }

    const liveShell =
      liveCard.querySelector(
        ".thumb-shell"
      );

    liveShell.innerHTML =
      "";

    liveShell.appendChild(
      canvas
    );
  } catch (error) {
    console.error(
      "Thumbnail render failed:",
      item,
      error
    );

    if (
      generation ===
      state.renderGeneration
    ) {
      const liveCard =
        pagesGrid.querySelector(
          `.page-card[data-uid="${item.uid}"]`
        );

      const liveShell =
        liveCard?.querySelector(
          ".thumb-shell"
        );

      if (liveShell) {
        liveShell.innerHTML =
          '<div class="placeholder" style="color:#cb3040">Preview unavailable</div>';
      }
    }
  } finally {
    if (
      state.rendering.get(
        item.uid
      ) === generation
    ) {
      state.rendering.delete(
        item.uid
      );
    }
  }
}

function setupObserver(
  generation
) {
  const cards = [
    ...pagesGrid.querySelectorAll(
      ".page-card"
    )
  ];

  /*
    Fallback for very old browsers.
  */

  if (
    !(
      "IntersectionObserver" in
      window
    )
  ) {
    cards.forEach(card => {
      const item =
        state.assembly.find(
          entry =>
            entry.uid ===
            card.dataset.uid
        );

      if (
        item &&
        !item.blank
      ) {
        renderThumb(
          item,
          { generation }
        );
      }
    });

    return;
  }

  state.observer =
    new IntersectionObserver(
      entries => {
        entries.forEach(
          entry => {
            if (
              !entry.isIntersecting
            ) {
              return;
            }

            const item =
              state.assembly.find(
                candidate =>
                  candidate.uid ===
                  entry.target
                    .dataset.uid
              );

            if (
              item &&
              !item.blank
            ) {
              renderThumb(
                item,
                { generation }
              );
            }

            state.observer?.unobserve(
              entry.target
            );
          }
        );
      },
      {
        root:
          pagesViewport,

        rootMargin:
          "450px 0px 450px 0px",

        threshold: 0.01
      }
    );

  cards.forEach(card => {
    const item =
      state.assembly.find(
        entry =>
          entry.uid ===
          card.dataset.uid
      );

    if (
      item &&
      !item.blank
    ) {
      state.observer.observe(
        card
      );
    }
  });
}

async function renderAll() {
  if (state.busy) return;

  const generation =
    state.renderGeneration;

  const items =
    state.assembly.filter(
      item => !item.blank
    );

  if (!items.length) {
    flashStatus(
      "Render करने के लिए PDF pages नहीं हैं.",
      "warning",
      0
    );

    return;
  }

  setBusy(true);

  try {
    setStatus(
      "सभी thumbnails render की जा रही हैं…",
      "normal",
      2
    );

    for (
      let index = 0;
      index < items.length;
      index++
    ) {
      if (
        generation !==
        state.renderGeneration
      ) {
        throw new Error(
          "Workspace changed during rendering."
        );
      }

      await renderThumb(
        items[index],
        {
          generation,
          force: true
        }
      );

      setStatus(
        `Thumbnail ${
          index + 1
        } / ${items.length}`,
        "normal",
        Math.round(
          ((index + 1) /
            items.length) *
            100
        )
      );
    }

    flashStatus(
      "सभी thumbnails ready हैं.",
      "success",
      100,
      900
    );
  } catch (error) {
    console.error(error);

    setStatus(
      "Thumbnail rendering रोक दी गई.",
      "warning",
      0
    );
  } finally {
    setBusy(false);
  }
}

/* =========================================================
   MOVEMENT
========================================================= */

function moveOne(
  id,
  direction
) {
  if (state.busy) return;

  const index =
    state.assembly.findIndex(
      item => item.uid === id
    );

  if (index < 0) return;

  const target =
    index + direction;

  if (
    target < 0 ||
    target >=
      state.assembly.length
  ) {
    return;
  }

  snapshot();

  const [moved] =
    state.assembly.splice(
      index,
      1
    );

  state.assembly.splice(
    target,
    0,
    moved
  );

  clearResult();

  renderAssembly();

  requestAnimationFrame(() => {
    pagesGrid
      .querySelector(
        `.page-card[data-uid="${id}"]`
      )
      ?.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "nearest"
      });
  });
}

function moveSelectedStep(
  direction
) {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );
    return;
  }

  snapshot();

  if (direction < 0) {
    for (
      let i = 1;
      i <
      state.assembly.length;
      i++
    ) {
      const current =
        state.assembly[i];

      const previous =
        state.assembly[i - 1];

      if (
        state.selected.has(
          current.uid
        ) &&
        !state.selected.has(
          previous.uid
        )
      ) {
        state.assembly[
          i - 1
        ] = current;

        state.assembly[i] =
          previous;
      }
    }
  } else {
    for (
      let i =
        state.assembly.length -
        2;
      i >= 0;
      i--
    ) {
      const current =
        state.assembly[i];

      const next =
        state.assembly[i + 1];

      if (
        state.selected.has(
          current.uid
        ) &&
        !state.selected.has(
          next.uid
        )
      ) {
        state.assembly[
          i + 1
        ] = current;

        state.assembly[i] =
          next;
      }
    }
  }

  clearResult();

  renderAssembly();
}

function moveSelectedBoundary(
  where
) {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );
    return;
  }

  snapshot();

  const selectedItems =
    state.assembly.filter(
      item =>
        state.selected.has(
          item.uid
        )
    );

  const otherItems =
    state.assembly.filter(
      item =>
        !state.selected.has(
          item.uid
        )
    );

  state.assembly =
    where === "start"
      ? [
          ...selectedItems,
          ...otherItems
        ]
      : [
          ...otherItems,
          ...selectedItems
        ];

  clearResult();

  renderAssembly();
}

/* =========================================================
   INCLUDE / SELECT
========================================================= */

function setSelectedIncluded(
  included
) {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );
    return;
  }

  snapshot();

  state.assembly.forEach(
    item => {
      if (
        state.selected.has(
          item.uid
        )
      ) {
        item.included =
          included;
      }
    }
  );

  clearResult();

  renderAssembly();
}

function selectAllCards() {
  state.selected =
    new Set(
      state.assembly.map(
        item => item.uid
      )
    );

  refreshCardStates();
}

/*
  FINAL POSITION now means FINAL OUTPUT POSITION.

  Excluded cards are no longer counted.
*/

function finalPositionItems() {
  return state.assembly.filter(
    item => item.included
  );
}

function parseFinalRange(
  text
) {
  const raw =
    String(text || "")
      .replace(/\s+/g, "");

  if (!raw) return [];

  const total =
    finalPositionItems().length;

  const positions =
    new Set();

  for (
    const part of
    raw
      .split(",")
      .filter(Boolean)
  ) {
    if (/^\d+$/.test(part)) {
      const number =
        Number(part);

      if (
        number >= 1 &&
        number <= total
      ) {
        positions.add(
          number
        );
      }

      continue;
    }

    const match =
      part.match(
        /^(\d*)-(\d*)$/
      );

    if (!match) {
      throw new Error(
        `"${part}" valid range नहीं है.`
      );
    }

    let start =
      match[1]
        ? Number(match[1])
        : 1;

    let end =
      match[2]
        ? Number(match[2])
        : total;

    start =
      Math.max(
        1,
        start
      );

    end =
      Math.min(
        total,
        end
      );

    if (start > end) {
      throw new Error(
        `"${part}" में start end से बड़ा है.`
      );
    }

    for (
      let number = start;
      number <= end;
      number++
    ) {
      positions.add(
        number
      );
    }
  }

  return [
    ...positions
  ].sort(
    (a, b) => a - b
  );
}

function selectByFinalPositions(
  positions
) {
  const output =
    finalPositionItems();

  state.selected =
    new Set();

  positions.forEach(
    position => {
      const item =
        output[
          position - 1
        ];

      if (item) {
        state.selected.add(
          item.uid
        );
      }
    }
  );

  refreshCardStates();
}

/* =========================================================
   DUPLICATE / DELETE / ROTATE
========================================================= */

function duplicateOne(id) {
  if (state.busy) return;

  const index =
    state.assembly.findIndex(
      item => item.uid === id
    );

  if (index < 0) return;

  snapshot();

  const original =
    state.assembly[index];

  const copy = {
    ...original,

    uid: uid(
      original.blank
        ? "blank"
        : "page"
    ),

    pageSize:
      Array.isArray(
        original.pageSize
      )
        ? [
            ...original.pageSize
          ]
        : original.pageSize
  };

  state.assembly.splice(
    index + 1,
    0,
    copy
  );

  clearResult();

  renderAssembly();
}

function removeOne(id) {
  if (state.busy) return;

  const index =
    state.assembly.findIndex(
      item => item.uid === id
    );

  if (index < 0) return;

  snapshot();

  state.assembly.splice(
    index,
    1
  );

  state.selected.delete(id);

  if (
    state.lastSelectedUid ===
    id
  ) {
    state.lastSelectedUid =
      null;
  }

  clearResult();

  renderAssembly();
}

function rotateSelected(
  delta
) {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );

    return;
  }

  snapshot();

  state.assembly.forEach(
    item => {
      if (
        state.selected.has(
          item.uid
        )
      ) {
        item.rotation =
          (
            item.rotation +
            delta +
            360
          ) % 360;
      }
    }
  );

  clearResult();

  renderAssembly();
}

function duplicateSelected() {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );

    return;
  }

  snapshot();

  const next = [];

  state.assembly.forEach(
    item => {
      next.push(item);

      if (
        state.selected.has(
          item.uid
        )
      ) {
        next.push({
          ...item,

          uid: uid(
            item.blank
              ? "blank"
              : "page"
          ),

          pageSize:
            Array.isArray(
              item.pageSize
            )
              ? [
                  ...item.pageSize
                ]
              : item.pageSize
        });
      }
    }
  );

  state.assembly = next;

  state.selected.clear();

  state.lastSelectedUid =
    null;

  clearResult();

  renderAssembly();
}

function removeSelected() {
  if (state.busy) return;

  if (!state.selected.size) {
    flashStatus(
      "पहले page cards select करें.",
      "warning",
      0
    );

    return;
  }

  snapshot();

  state.assembly =
    state.assembly.filter(
      item =>
        !state.selected.has(
          item.uid
        )
    );

  state.selected.clear();

  state.lastSelectedUid =
    null;

  clearResult();

  renderAssembly();
}

/* =========================================================
   BLANK PAGES
========================================================= */

function openBlankDialog() {
  if (state.busy) return;

  $("blankDialog")
    .classList.add("show");
}

function closeBlankDialog() {
  $("blankDialog")
    .classList.remove("show");
}

function addConfiguredBlankPages() {
  if (state.busy) return;

  const blankSize =
    $("blankSizeSelect")
      .value;

  const orientation =
    $("blankOrientationSelect")
      .value;

  const count =
    Math.max(
      1,
      Math.min(
        20,
        Number(
          $("blankCountInput")
            .value
        ) || 1
      )
    );

  const insertMode =
    $("blankInsertSelect")
      .value;

  const base =
    BLANK_SIZES[
      blankSize
    ] ||
    BLANK_SIZES.a4;

  const pageSize =
    orientation ===
    "landscape"
      ? [
          base[1],
          base[0]
        ]
      : [...base];

  snapshot();

  const blanks =
    Array.from(
      { length: count },
      () => ({
        uid:
          uid("blank"),

        fileId: null,

        pageNo: null,

        rotation: 0,

        included: true,

        blank: true,

        blankSize,

        orientation,

        pageSize: [
          ...pageSize
        ]
      })
    );

  let insertIndex =
    state.assembly.length;

  if (
    insertMode ===
    "start"
  ) {
    insertIndex = 0;
  } else if (
    insertMode ===
      "after-selection" &&
    state.selected.size
  ) {
    const indexes =
      state.assembly
        .map(
          (item, index) =>
            state.selected.has(
              item.uid
            )
              ? index
              : -1
        )
        .filter(
          index =>
            index >= 0
        );

    if (indexes.length) {
      insertIndex =
        Math.max(
          ...indexes
        ) + 1;
    }
  }

  state.assembly.splice(
    insertIndex,
    0,
    ...blanks
  );

  state.selected =
    new Set(
      blanks.map(
        item => item.uid
      )
    );

  state.lastSelectedUid =
    blanks.length
      ? blanks[
          blanks.length - 1
        ].uid
      : null;

  clearResult();

  renderAssembly();

  closeBlankDialog();

  flashStatus(
    `${count} blank page(s) add की गईं.`,
    "success"
  );
}

/* =========================================================
   MIX SCANS
========================================================= */

function takeMany(
  source,
  cursor,
  count,
  target
) {
  let taken = 0;

  while (
    taken < count &&
    cursor.index <
      source.length
  ) {
    target.push(
      source[
        cursor.index
      ]
    );

    cursor.index++;

    taken++;
  }
}

function interleaveFirstTwo() {
  if (state.busy) return;

  if (
    state.fileOrder.length <
    2
  ) {
    flashStatus(
      "Mix के लिए कम से कम 2 PDFs चाहिए.",
      "warning",
      0
    );

    return;
  }

  const firstId =
    state.fileOrder[0];

  const secondId =
    state.fileOrder[1];

  let first =
    state.assembly
      .filter(
        item =>
          item.fileId ===
          firstId
      )
      .sort(
        (a, b) =>
          a.pageNo -
          b.pageNo
      );

  let second =
    state.assembly
      .filter(
        item =>
          item.fileId ===
          secondId
      )
      .sort(
        (a, b) =>
          a.pageNo -
          b.pageNo
      );

  if (
    $("reverseFirstCheck")
      .checked
  ) {
    first =
      [...first].reverse();
  }

  if (
    $("reverseSecondCheck")
      .checked
  ) {
    second =
      [...second].reverse();
  }

  const [
    firstCount,
    secondCount
  ] =
    $("mixPatternSelect")
      .value
      .split("-")
      .map(Number);

  const startSecond =
    $("startSecondCheck")
      .checked;

  const rest =
    state.assembly.filter(
      item =>
        item.fileId !==
          firstId &&
        item.fileId !==
          secondId
    );

  const mixed = [];

  const firstCursor = {
    index: 0
  };

  const secondCursor = {
    index: 0
  };

  while (
    firstCursor.index <
      first.length ||
    secondCursor.index <
      second.length
  ) {
    if (startSecond) {
      takeMany(
        second,
        secondCursor,
        secondCount,
        mixed
      );

      takeMany(
        first,
        firstCursor,
        firstCount,
        mixed
      );
    } else {
      takeMany(
        first,
        firstCursor,
        firstCount,
        mixed
      );

      takeMany(
        second,
        secondCursor,
        secondCount,
        mixed
      );
    }
  }

  snapshot();

  state.assembly = [
    ...mixed,
    ...rest
  ];

  state.selected.clear();

  state.lastSelectedUid =
    null;

  clearResult();

  renderAssembly();

  flashStatus(
    `पहली 2 PDFs ${firstCount}:${secondCount} pattern में interleave की गईं.`,
    "success"
  );
}

/* =========================================================
   LARGE PREVIEW
========================================================= */

async function showPreview(item) {
  if (
    item.blank ||
    state.busy
  ) {
    return;
  }

  const record =
    state.files.get(
      item.fileId
    );

  if (!record) return;

  previewModal.classList.add(
    "show"
  );

  previewTitle.textContent =
    `${sourceLabel(
      item.fileId
    )} • Page ${
      item.pageNo
    }`;

  modalBody.innerHTML =
    '<div class="placeholder" style="color:#b9cdd7">Rendering preview…</div>';

  try {
    const page =
      await record.pdfJs.getPage(
        item.pageNo
      );

    const rotation =
      getPdfJsRotation(
        page,
        item.rotation
      );

    const base =
      page.getViewport({
        scale: 1,
        rotation
      });

    const maxWidth =
      Math.min(
        780,
        Math.max(
          260,
          innerWidth - 70
        )
      );

    const scale =
      Math.min(
        1.8,
        maxWidth /
          Math.max(
            1,
            base.width
          )
      );

    const viewport =
      page.getViewport({
        scale,
        rotation
      });

    const canvas =
      document.createElement(
        "canvas"
      );

    const context =
      canvas.getContext(
        "2d",
        { alpha: false }
      );

    canvas.width =
      Math.max(
        1,
        Math.ceil(
          viewport.width
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.ceil(
          viewport.height
        )
      );

    context.fillStyle =
      "#ffffff";

    context.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    await page.render({
      canvasContext:
        context,

      viewport,

      background:
        "rgb(255,255,255)"
    }).promise;

    if (
      !previewModal.classList.contains(
        "show"
      )
    ) {
      return;
    }

    modalBody.innerHTML =
      "";

    modalBody.appendChild(
      canvas
    );
  } catch (error) {
    console.error(
      "Preview failed:",
      error
    );

    modalBody.innerHTML =
      '<div class="placeholder" style="color:#ff8b94">Preview नहीं बन सकी.</div>';
  }
}

/* =========================================================
   MERGE VALIDATION
========================================================= */

function validateAssembly(items) {
  for (const item of items) {
    if (item.blank) {
      continue;
    }

    const record =
      state.files.get(
        item.fileId
      );

    if (!record) {
      throw new Error(
        "एक source PDF workspace में उपलब्ध नहीं है."
      );
    }

    if (
      !Number.isInteger(
        item.pageNo
      ) ||
      item.pageNo < 1 ||
      item.pageNo >
        record.pageCount
    ) {
      throw new Error(
        `${record.file.name}: Page ${item.pageNo} valid नहीं है.`
      );
    }
  }
}

/* =========================================================
   VISUAL FALLBACK MERGE
========================================================= */

async function canvasToJpegBytes(
  canvas,
  quality = 0.92
) {
  const blob =
    await new Promise(
      (resolve, reject) => {
        canvas.toBlob(
          result => {
            if (result) {
              resolve(result);
            } else {
              reject(
                new Error(
                  "Page image conversion failed."
                )
              );
            }
          },
          "image/jpeg",
          quality
        );
      }
    );

  return new Uint8Array(
    await blob.arrayBuffer()
  );
}

async function rasterAppendPage(
  output,
  record,
  item
) {
  const pdfPage =
    await record.pdfJs.getPage(
      item.pageNo
    );

  const rotation =
    getPdfJsRotation(
      pdfPage,
      item.rotation
    );

  /*
    scale:1 determines output PDF page proportions
  */

  const outputViewport =
    pdfPage.getViewport({
      scale: 1,
      rotation
    });

  /*
    Render roughly around 1600px on the longest side,
    capped to avoid huge memory usage.
  */

  const renderScale =
    Math.min(
      2,
      Math.max(
        1.35,
        1600 /
          Math.max(
            outputViewport.width,
            outputViewport.height
          )
      )
    );

  const renderViewport =
    pdfPage.getViewport({
      scale: renderScale,
      rotation
    });

  const canvas =
    document.createElement(
      "canvas"
    );

  const context =
    canvas.getContext(
      "2d",
      { alpha: false }
    );

  canvas.width =
    Math.max(
      1,
      Math.ceil(
        renderViewport.width
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.ceil(
        renderViewport.height
      )
    );

  context.fillStyle =
    "#ffffff";

  context.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  await pdfPage.render({
    canvasContext:
      context,

    viewport:
      renderViewport,

    background:
      "rgb(255,255,255)"
  }).promise;

  const imageBytes =
    await canvasToJpegBytes(
      canvas,
      0.92
    );

  const image =
    await output.embedJpg(
      imageBytes
    );

  const outputPage =
    output.addPage([
      outputViewport.width,
      outputViewport.height
    ]);

  outputPage.drawImage(
    image,
    {
      x: 0,
      y: 0,

      width:
        outputViewport.width,

      height:
        outputViewport.height
    }
  );

  /*
    Release large canvas memory quickly.
  */

  canvas.width = 1;
  canvas.height = 1;
}

/* =========================================================
   LOAD DIRECT-COPY SOURCES
========================================================= */

async function prepareSourceDocs(
  items
) {
  const documents =
    new Map();

  const usedIds = [
    ...new Set(
      items
        .filter(
          item =>
            !item.blank
        )
        .map(
          item =>
            item.fileId
        )
    )
  ];

  for (
    let index = 0;
    index < usedIds.length;
    index++
  ) {
    const fileId =
      usedIds[index];

    const record =
      state.files.get(
        fileId
      );

    if (!record) {
      continue;
    }

    /*
      PDFs that failed pdf-lib preflight
      go straight to compatibility mode.
    */

    if (
      record.mergeMode ===
      "copy"
    ) {
      try {
        const doc =
          await PDFDocument.load(
            record.buffer.slice(
              0
            ),
            {
              ignoreEncryption:
                false
            }
          );

        documents.set(
          fileId,
          doc
        );
      } catch (error) {
        /*
          Do not abort.
          The affected PDF will use visual fallback.
        */

        console.warn(
          "Direct source load failed. Compatibility mode will be used:",
          record.file.name,
          error
        );
      }
    }

    setStatus(
      `Source ${
        index + 1
      } / ${
        usedIds.length
      } prepare हो रही है…`,
      "normal",
      4 +
        Math.round(
          ((index + 1) /
            Math.max(
              1,
              usedIds.length
            )) *
            10
        )
    );
  }

  return documents;
}

/* =========================================================
   MERGE
========================================================= */

async function mergeOutput() {
  if (state.busy) return;

  const items =
    includedItems().map(
      item => ({
        ...item,

        pageSize:
          Array.isArray(
            item.pageSize
          )
            ? [
                ...item.pageSize
              ]
            : item.pageSize
      })
    );

  if (!items.length) {
    setStatus(
      "Final PDF के लिए कम से कम एक page use करें.",
      "error",
      0
    );

    return;
  }

  clearResult();

  setBusy(true);

  let fallbackPages = 0;

  try {
    validateAssembly(items);

    setStatus(
      "MERGE PROCESS INITIALISED…",
      "normal",
      2
    );

    const sourceDocs =
      await prepareSourceDocs(
        items
      );

    const output =
      await PDFDocument.create();

    for (
      let index = 0;
      index < items.length;
      index++
    ) {
      const item =
        items[index];

      if (item.blank) {
        const dimensions =
          Array.isArray(
            item.pageSize
          )
            ? [
                ...item.pageSize
              ]
            : [
                595.28,
                841.89
              ];

        const page =
          output.addPage(
            dimensions
          );

        if (item.rotation) {
          page.setRotation(
            degrees(
              item.rotation
            )
          );
        }
      } else {
        const record =
          state.files.get(
            item.fileId
          );

        const sourceDoc =
          sourceDocs.get(
            item.fileId
          );

        let copied = false;

        /*
          First attempt:
          lossless direct page copy.
        */

        if (sourceDoc) {
          try {
            const [page] =
              await output.copyPages(
                sourceDoc,
                [
                  item.pageNo -
                    1
                ]
              );

            const originalRotation =
              page.getRotation?.()
                .angle || 0;

            page.setRotation(
              degrees(
                (
                  originalRotation +
                  item.rotation +
                  360
                ) % 360
              )
            );

            output.addPage(
              page
            );

            copied = true;
          } catch (error) {
            console.warn(
              `Direct copy failed: ${record.file.name} page ${item.pageNo}. Using compatibility mode.`,
              error
            );
          }
        }

        /*
          Second attempt:
          PDF.js renders the page visually and
          embeds it into the final PDF.

          This is the fallback for PDFs that can
          preview correctly but pdf-lib cannot copy.
        */

        if (!copied) {
          await rasterAppendPage(
            output,
            record,
            item
          );

          fallbackPages++;
        }
      }

      setStatus(
        `Output page ${
          index + 1
        } / ${
          items.length
        } बन रहा है…`,
        "normal",
        14 +
          Math.round(
            ((index + 1) /
              items.length) *
              76
          )
      );
    }

    const outputName =
      safeName(
        $("outputName")
          .value
      );

    output.setTitle(
      outputName
    );

    output.setCreator(
      "HindiTools.com Visual Merge PDF"
    );

    output.setProducer(
      "HindiTools.com"
    );

    output.setCreationDate(
      new Date()
    );

    output.setModificationDate(
      new Date()
    );

    setStatus(
      "Final PDF verify की जा रही है…",
      "normal",
      94
    );

    const bytes =
      await output.save({
        useObjectStreams: true,
        objectsPerTick: 40
      });

    /*
      Important:
      Do not tell the user the PDF is ready until
      the generated PDF can itself be reopened.
    */

    const verification =
      await PDFDocument.load(
        bytes,
        {
          ignoreEncryption:
            true
        }
      );

    const verifiedCount =
      verification.getPageCount();

    if (
      verifiedCount !==
      items.length
    ) {
      throw new Error(
        `Verification failed. Expected ${items.length} pages but generated PDF contains ${verifiedCount}.`
      );
    }

    const blob =
      new Blob(
        [bytes],
        {
          type:
            "application/pdf"
        }
      );

    const filename =
      outputName + ".pdf";

    state.currentUrl =
      URL.createObjectURL(
        blob
      );

    downloadLink.href =
      state.currentUrl;

    downloadLink.download =
      filename;

    resultText.textContent =
      `${items.length} pages • ` +
      `${formatBytes(
        blob.size
      )} • final PDF ready` +
      (
        fallbackPages
          ? ` • ${fallbackPages} page(s) compatibility mode में processed`
          : ""
      );

    resultPanel.classList.add(
      "show"
    );

    setStatus(
      "MERGE COMPLETE ✓",
      "success",
      100
    );

    resultPanel.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  } catch (error) {
    console.error(
      "Merge failed:",
      error
    );

    const message =
      error?.message
        ? "Merge failed: " +
          error.message
        : "PDF merge नहीं हो सकी.";

    setStatus(
      message,
      "error",
      0
    );
  } finally {
    setBusy(false);

    updateSummary();
  }
}

/* =========================================================
   CLEAR WORKSPACE
========================================================= */

function clearWorkspace() {
  if (state.busy) return;

  if (state.observer) {
    state.observer.disconnect();
    state.observer = null;
  }

  /*
    Invalidates any thumbnail promises
    that may still be finishing.
  */

  state.renderGeneration++;

  /*
    Now that workspace really is being destroyed,
    PDF.js documents can be released.
  */

  for (
    const record of
    state.files.values()
  ) {
    try {
      record.pdfJs?.destroy();
    } catch (error) {}
  }

  state.files.clear();

  state.fileOrder = [];

  state.assembly = [];

  state.selected.clear();

  state.history = [];

  state.redoHistory = [];

  state.rendering.clear();

  state.lastSelectedUid =
    null;

  sourceList.innerHTML = "";

  pagesGrid.innerHTML = "";

  workspace.classList.remove(
    "show"
  );

  fileInput.value = "";

  clearResult();
  clearStatus();

  updateSummary();

  scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =========================================================
   BLANK PAGE DIALOG
========================================================= */

$("closeBlankDialogBtn").onclick =
  closeBlankDialog;

$("cancelBlankBtn").onclick =
  closeBlankDialog;

$("confirmBlankBtn").onclick =
  addConfiguredBlankPages;

$("blankDialog").onclick =
  event => {
    if (
      event.target ===
      $("blankDialog")
    ) {
      closeBlankDialog();
    }
  };

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {
    const target =
      event.target;

    const editing =
      target &&
      (
        target.matches(
          "input, textarea, select"
        ) ||
        target.isContentEditable
      );

    if (
      event.key ===
      "Escape"
    ) {
      previewModal.classList.remove(
        "show"
      );

      closeBlankDialog();

      return;
    }

    if (state.busy) {
      return;
    }

    if (
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      event.key
        .toLowerCase() ===
        "z"
    ) {
      if (editing) return;

      event.preventDefault();

      if (event.shiftKey) {
        redo();
      } else {
        undo();
      }

      return;
    }

    if (
      (
        event.ctrlKey ||
        event.metaKey
      ) &&
      event.key
        .toLowerCase() ===
        "a"
    ) {
      if (editing) return;

      event.preventDefault();

      selectAllCards();

      return;
    }

    if (editing) return;

    if (
      event.key ===
        "Delete" ||
      event.key ===
        "Backspace"
    ) {
      if (
        state.selected.size
      ) {
        event.preventDefault();

        removeSelected();
      }

      return;
    }

    if (
      event.key
        .toLowerCase() ===
      "r"
    ) {
      rotateSelected(90);

      return;
    }

    if (
      event.key
        .toLowerCase() ===
      "d"
    ) {
      duplicateSelected();
    }
  }
);

/* =========================================================
   FAQ
========================================================= */

document
  .querySelectorAll(
    ".faq-q"
  )
  .forEach(button => {
    button.onclick =
      () => {
        button.parentElement
          .classList.toggle(
            "active"
          );
      };
  });

/* =========================================================
   THEME
========================================================= */

$("themeBtn").onclick =
  () => {
    const next =
      (
        document
          .documentElement
          .dataset.theme ||
        "dark"
      ) === "dark"
        ? "light"
        : "dark";

    document
      .documentElement
      .dataset.theme =
      next;

    try {
      localStorage.setItem(
        "ht-hud-theme",
        next
      );
    } catch (error) {}
  };

/* =========================================================
   MOBILE MENU
========================================================= */

$("menuBtn").onclick =
  () => {
    const nav =
      $("mainNav");

    const open =
      nav.classList.toggle(
        "open"
      );

    $("menuBtn")
      .setAttribute(
        "aria-expanded",
        String(open)
      );
  };

$("mainNav")
  .querySelectorAll("a")
  .forEach(link => {
    link.onclick =
      () => {
        $("mainNav")
          .classList.remove(
            "open"
          );

        $("menuBtn")
          .setAttribute(
            "aria-expanded",
            "false"
          );
      };
  });

/* =========================================================
   START
========================================================= */

updateSummary();
</script>
