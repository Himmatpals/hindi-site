<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to Word | HindiTools</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <!-- Using docx library for actual Word generation -->
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        /* ... Your existing CSS remains the same ... */
        :root {
            --bg: #fff8f0; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
            --border: #f1d7bd; --primary: #e66a1f; --primary-dark: #bf4e13;
            --secondary: #273c75; --green: #12805c; --red: #dc2626; --shadow: 0 18px 45px rgba(120, 72, 20, 0.12);
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; }
        .container { width: min(1180px, calc(100% - 32px)); margin: auto; }
        
        /* Added the missing button style from your prototype */
        .primary-btn {
            background: var(--secondary); color: white; border: none; padding: 16px 32px;
            border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%;
            transition: transform 0.2s; margin-top: 10px;
        }
        .primary-btn:disabled { background: #ccc; cursor: not-allowed; }
        .primary-btn:hover:not(:disabled) { transform: translateY(-2px); background: #1a2a56; }

        /* The rest of your styles provided in the prompt */
        header { background: white; border-bottom: 1px solid var(--border); padding: 15px 0; }
        .tool-shell { background: white; padding: 30px; border-radius: 24px; box-shadow: var(--shadow); margin-top: 30px; }
        .dropzone { border: 2px dashed #efb276; padding: 40px; text-align: center; border-radius: 20px; background: #fffaf5; }
        .upload-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .setting-card { background: #fefefe; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .status-box { display: none; margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; }
        .status-box.show { display: block; background: #e0f2fe; color: #0369a1; }
        .download-card { display: none; margin-top: 20px; padding: 20px; background: #ecfdf5; border-radius: 15px; text-align: center; }
        .download-card.show { display: block; }
        .download-btn { display: inline-block; background: var(--green); color: white; padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="container" style="display:flex; justify-content: space-between; align-items:center;">
            <strong style="font-size: 24px; color: var(--secondary);">HindiTools</strong>
            <nav>PDF to Word | Privacy</nav>
        </div>
    </header>

    <main class="container">
        <div style="text-align:center; padding: 40px 0;">
            <h1>PDF को Word में बदलें</h1>
            <p>High-quality conversion with client-side processing.</p>
        </div>

        <div class="tool-shell">
            <div class="dropzone" id="dropzone">
                <input type="file" id="fileInput" accept="application/pdf" style="display:none" />
                <h2>PDF यहाँ चुनें</h2>
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Select File</button>
                <div id="fileName" style="margin-top:10px; color: #666;">No file selected</div>
            </div>

            <div style="margin-top:25px;">
                <div class="setting-card">
                    <label>Extraction Quality: <span id="qv">90%</span></label>
                    <input type="range" id="quality" style="width:100%" min="50" max="100" value="90" oninput="document.getElementById('qv').innerText=this.value+'%'">
                </div>
                
                <button class="primary-btn" id="createWordBtn" disabled>Create Word Document</button>
            </div>

            <div id="statusBox" class="status-box"></div>

            <div id="downloadCard" class="download-card">
                <h3>✅ File Ready!</h3>
                <p>आपका Word दस्तावेज़ तैयार है।</p>
                <button id="downloadAction" class="download-btn">Download .DOCX</button>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const createBtn = document.getElementById('createWordBtn');
        const statusBox = document.getElementById('statusBox');
        const downloadCard = document.getElementById('downloadCard');

        fileInput.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('fileName').innerText = selectedFile.name;
                createBtn.disabled = false;
            }
        });

        createBtn.addEventListener('click', async () => {
            statusBox.innerText = "Reading PDF content...";
            statusBox.className = "status-box show";
            createBtn.disabled = true;

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let fullText = [];

                for (let i = 1; i <= pdf.numPages; i++) {
                    statusBox.innerText = `Processing Page ${i} of ${pdf.numPages}...`;
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const strings = content.items.map(item => item.str);
                    fullText.push(strings.join(" "));
                }

                generateDocx(fullText);
            } catch (err) {
                statusBox.innerText = "Error: " + err.message;
            }
        });

        function generateDocx(textArray) {
            const { Document, Packer, Paragraph, TextRun } = docx;

            const doc = new Document({
                sections: [{
                    properties: {},
                    children: textArray.map(text => new Paragraph({
                        children: [new TextRun(text)],
                        spacing: { after: 200 }
                    })),
                }],
            });

            Packer.toBlob(doc).then(blob => {
                statusBox.innerText = "Conversion Complete!";
                downloadCard.classList.add('show');
                
                document.getElementById('downloadAction').onclick = () => {
                    saveAs(blob, selectedFile.name.replace(".pdf", "") + ".docx");
                };
            });
        }
    </script>
</body>
</html>
