<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF वॉटरमार्कर — इंटरैक्टिव विज़ार्ड</title>
  <meta name="description" content="PDF में वॉटरमार्क जोड़ें — टेक्स्ट या इमेज, पोजीशन, ओपेसिटी, रोटेशन, सभी ब्राउज़र में।">
  <style>
    :root {
      --bg: #f5f7f5;
      --card: #ffffff;
      --muted: #d4d4d4;
      --accent: #3b82f6; /* Blue */
      --accent-2: #8b5cf6; /* Purple */
      --text: #1f2937;
      --text-dim: #6b7280;
      --ok: #10b981; /* Green */
      --warn: #f59e0b; /* Yellow */
      --err: #ef4444; /* Red */
      --shadow: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font: 16px/1.5 system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: linear-gradient(180deg, #e6f0fa, var(--bg)); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; align-items: center; gap: 0.875rem; margin: 0.75rem 0 1.375rem; }
    header .logo { width: 2.375rem; height: 2.375rem; border-radius: 0.625rem; background: radial-gradient(120% 120% at 20% 10%, var(--accent) 0%, var(--accent-2) 70%, transparent 71%), conic-gradient(from 200deg at 60% 60%, #e5e7eb 0 60deg, var(--card) 60deg 360deg); box-shadow: 0 0 0 2px var(--muted), 0 0.625rem 1.875rem var(--shadow); }
    h1 { font-size: clamp(1.375rem, 4vw, 2rem); margin: 0; }

    .wizard { display: grid; grid-template-columns: 17.5rem 1fr; gap: 1.125rem; }
    @media (max-width: 900px) { .wizard { grid-template-columns: 1fr; } }
    .steps { background: var(--card); border: 1px solid var(--muted); border-radius: 1rem; padding: 0.625rem; box-shadow: 0 2px 8px var(--shadow); }
    .step-item { display: flex; align-items: center; gap: 0.625rem; padding: 0.75rem; border-radius: 0.75rem; cursor: pointer; color: var(--text-dim); transition: all 0.2s; }
    .step-item.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2)); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
    .step-item:hover { background: rgba(59,130,246,0.1); }
    .step-index { width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border-radius: 0.625rem; background: var(--muted); font-weight: 700; }

    .panel { background: var(--card); border: 1px solid var(--muted); border-radius: 1rem; padding: 1.125rem; min-height: 30rem; box-shadow: 0 2px 8px var(--shadow); }
    .drop { border: 2px dashed var(--muted); border-radius: 1.125rem; padding: 1.75rem; text-align: center; transition: all 0.25s; cursor: pointer; }
    .drop:hover, .drop.dragover { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,0.15); }
    .btn { border: none; border-radius: 0.75rem; padding: 0.625rem 0.875rem; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn:hover, .btn:focus { transform: translateY(-1px); filter: brightness(1.1); outline: none; }
    .btn.secondary { background: linear-gradient(135deg, #e5e7eb, #d1d5db); color: var(--text); }
    .btn.ghost { background: transparent; border: 1px solid var(--muted); color: var(--text); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.625rem; }

    .grid { display: grid; gap: 0.875rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    label { display: flex; align-items: center; justify-content: space-between; gap: 0.875rem; background: #f9fafb; border: 1px solid var(--muted); padding: 0.75rem 0.875rem; border-radius: 0.75rem; }
    label .lbl { font-weight: 700; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=text], input[type=number], input[type=color] { width: 100%; background: #f9fafb; border: 1px solid var(--muted); color: var(--text); padding: 0.625rem; border-radius: 0.625rem; }
    select { background: #f9fafb; border: 1px solid var(--muted); color: var(--text); padding: 0.625rem; border-radius: 0.625rem; }
    textarea { width: 100%; background: #f9fafb; border: 1px solid var(--muted); color: var(--text); padding: 0.625rem; border-radius: 0.625rem; min-height: 80px; resize: vertical; }

    .switch { position: relative; display: inline-block; width: 3.125rem; height: 1.75rem; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--muted); transition: all 0.2s; border-radius: 2rem; }
    .slider:before { position: absolute; content: ""; height: 1.375rem; width: 1.375rem; left: 0.25rem; top: 0.1875rem; background: white; transition: transform 0.2s; border-radius: 50%; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(1.375rem); }

    .pulse { animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.6); } 70% { box-shadow: 0 0 0 0.75rem rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }

    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.875rem, 1fr)); gap: 0.5rem; margin-top: 0.75rem; }
    .thumb { background: var(--card); border: 1px solid var(--muted); border-radius: 0.625rem; padding: 0.375rem; text-align: center; }
    .thumb canvas { width: 100%; height: auto; border-radius: 0.375rem; }

    .progress { height: 0.875rem; background: #e5e7eb; border: 1px solid var(--muted); border-radius: 6.25rem; overflow: hidden; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.15s; }

    .stat { display: flex; align-items: center; gap: 0.625rem; background: #f9fafb; border: 1px solid var(--muted); border-radius: 0.75rem; padding: 0.625rem 0.75rem; }
    .stat .value { font-weight: 800; }

    .k { color: var(--accent); }
    .hint { color: var(--text-dim); font-size: 0.95rem; }
    .danger { color: var(--err); font-weight: 700; }
    .success { color: var(--ok); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }

    footer { opacity: 0.8; margin-top: 1rem; font-size: 0.9rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    /* New styles for watermark tool */
    .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file-info-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .file-info-item { display: flex; align-items: center; gap: 5px; }
    .file-info-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .preview-canvas { max-width: 100%; border: 1px solid var(--muted); border-radius: 8px; }
    .watermark-preview { position: relative; width: 100%; height: 300px; border: 1px solid var(--muted); border-radius: 8px; margin-top: 10px; overflow: hidden; background: white; }
    .watermark-preview-page { width: 100%; height: 100%; position: relative; background: linear-gradient(45deg, #f9fafb 25%, transparent 25%), linear-gradient(-45deg, #f9fafb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f9fafb 75%), linear-gradient(-45deg, transparent 75%, #f9fafb 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    .watermark-preview-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--text-dim); }
    .watermark-preview-watermark { position: absolute; padding: 10px; border-radius: 4px; pointer-events: none; }
    .position-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
    .position-btn { padding: 10px; text-align: center; border: 1px solid var(--muted); border-radius: 4px; cursor: pointer; background: #f9fafb; font-size: 0.9rem; }
    .position-btn.active { background: var(--accent); color: white; }
    .font-preview { font-size: 24px; margin-top: 10px; padding: 10px; border: 1px solid var(--muted); border-radius: 4px; text-align: center; background: white; }
    .option-group { background: #f9fafb; border: 1px solid var(--muted); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .option-group-title { font-weight: bold; margin-bottom: 10px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .option-group-title:before { content: "▶"; font-size: 0.8em; }
    .image-preview-container { text-align: center; margin: 10px 0; }
    .image-preview { max-width: 200px; max-height: 150px; border: 1px solid var(--muted); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>PDF वॉटरमार्कर — विज़ार्ड</h1>
        <div class="hint">निजी, तेज़ और शक्तिशाली। आपकी फ़ाइल आपके डिवाइस पर ही रहती है।</div>
      </div>
    </header>

    <div class="wizard" role="application" aria-label="PDF वॉटरमार्क विज़ार्ड">
      <nav class="steps" aria-label="कदम">
        <div class="step-item active" data-step="1"><div class="step-index">1</div><div>फ़ाइल चुनें</div></div>
        <div class="step-item" data-step="2"><div class="step-index">2</div><div>वॉटरमार्क सेटिंग</div></div>
        <div class="step-item" data-step="3"><div class="step-index">3</div><div>पोजीशन और स्टाइल</div></div>
        <div class="step-item" data-step="4"><div class="step-index">4</div><div>प्रीव्यू और एप्लाई</div></div>
      </nav>
      <section class="panel" id="panel"></section>
    </div>

    <footer>
      सुझाव: <span class="k">टेक्स्ट वॉटरमार्क</span> सबसे हल्का होता है। <span class="k">इमेज वॉटरमार्क</span> लोगो या सिग्नेचर के लिए बेहतर है।
    </footer>
  </div>

  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  
  <script>
    (function () {
      // Set PDF.js worker
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      
      const $ = (sel, el = document) => el.querySelector(sel);
      const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

      const state = {
        file: null,
        fileBytes: null,
        pdfDoc: null,
        numPages: 0,
        watermarkType: 'text', // 'text' or 'image'
        watermarkText: 'कॉन्फिडेंशियल',
        watermarkImage: null,
        watermarkImageBytes: null,
        fontSize: 48,
        fontColor: '#888888',
        opacity: 0.6,
        rotation: -45,
        position: 'center',
        pageRange: 'all',
        applyTo: 'all', // 'all', 'first', 'last', 'custom'
        isProcessing: false,
        abortController: null
      };

      const steps = $$('.step-item');
      steps.forEach(s => s.addEventListener('click', () => !state.isProcessing && goStep(parseInt(s.dataset.step))));
      const panel = $('#panel');

      const humanBytes = n => {
        if (n == null || n === 0) return '—';
        const units = ['B', 'KB', 'MB', 'GB'];
        let value = n;
        let unitIndex = 0;
        
        while (value >= 1024 && unitIndex < units.length - 1) {
          value /= 1024;
          unitIndex++;
        }
        
        return `${value.toFixed(unitIndex > 0 ? 2 : 0)} ${units[unitIndex]}`;
      };

      // Step 1: File Selection
      function renderStep1() {
        setActive(1);
        panel.innerHTML = `
          <div class="grid" style="gap:1rem">
            <div class="drop" id="drop" aria-label="यहाँ PDF छोड़ें या फ़ाइल चुनें" tabindex="0">
              <h2>अपना PDF यहाँ छोड़ें</h2>
              <div class="hint">या</div>
              <div class="btn-row" style="justify-content:center;margin-top:0.625rem">
                <label class="btn pulse" for="fileInput">PDF चुनें</label>
                <input id="fileInput" type="file" accept=".pdf,application/pdf" hidden>
              </div>
              <div class="hint" style="margin-top:0.75rem">आपकी फ़ाइल पूरी तरह सुरक्षित — कोई अपलोड नहीं।</div>
            </div>
            <div id="fileInfo" class="stat" style="display:none">
              <div class="file-info-row">
                <div class="file-info-item">
                  <span class="value" id="fileName"></span>
                </div>
                <div class="file-info-item">
                  <span class="file-info-badge" id="fileSize"></span>
                </div>
                <div class="file-info-item">
                  <span class="file-info-badge" id="filePages">—</span>
                </div>
                <div class="btn-row" style="margin-left:auto">
                  <button class="btn ghost" id="clearFile">हटाएँ</button>
                </div>
              </div>
            </div>
            <div id="thumbWrap" style="display:none">
              <div class="hint">त्वरित थंबनेल</div>
              <div class="thumbs" id="thumbs"></div>
            </div>
            <div id="uploadError" class="hint danger" style="display:none"></div>
            <div class="btn-row" style="justify-content:flex-end">
              <button class="btn secondary" disabled id="to2">अगला: वॉटरमार्क सेटिंग →</button>
            </div>
          </div>`;

        const drop = $('#drop'), fileInput = $('#fileInput'), to2 = $('#to2'), clearFile = $('#clearFile');
        
        const onFile = async f => {
          if (!f || !(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'))) {
            showError('कृपया केवल PDF फ़ाइल चुनें।');
            return;
          }
          
          try {
            // Reset state
            state.file = f;
            state.fileBytes = await fileToBytes(f);
            state.pdfDoc = null;
            state.numPages = 0;
            
            $('#fileInfo').style.display = 'flex';
            $('#fileName').textContent = f.name;
            $('#fileSize').textContent = humanBytes(f.size);
            $('#uploadError').style.display = 'none';
            to2.disabled = true;
            $('#thumbWrap').style.display = 'none';
            $('#thumbs').innerHTML = '';

            // Try to load with PDF.js
            try {
              state.pdfDoc = await openWithPDFJS(state.fileBytes);
              state.numPages = state.pdfDoc.numPages;
              $('#filePages').textContent = `${state.numPages} पेज`;
              await renderThumbs();
              to2.disabled = false;
              $('#thumbWrap').style.display = 'block';
            } catch (err) {
              console.warn('PDF.js failed:', err);
              // Fallback to PDF-lib for page count
              await fallbackPageCount();
              if (state.numPages > 0) to2.disabled = false;
            }
          } catch (e) {
            console.error(e);
            showError('फ़ाइल पढ़ने में त्रुटि। फ़ाइल पासवर्ड-प्रोटेक्टेड या दूषित हो सकती है।');
          }
        };

        // Setup event listeners
        drop.addEventListener('dragover', e => { 
          e.preventDefault(); 
          e.stopPropagation();
          drop.classList.add('dragover'); 
        });
        
        drop.addEventListener('dragleave', e => {
          e.preventDefault();
          e.stopPropagation();
          drop.classList.remove('dragover');
        });
        
        drop.addEventListener('drop', e => {
          e.preventDefault(); 
          e.stopPropagation();
          drop.classList.remove('dragover'); 
          if (e.dataTransfer.files.length > 0) {
            onFile(e.dataTransfer.files[0]);
          }
        });
        
        drop.addEventListener('click', () => fileInput.click());
        drop.addEventListener('keydown', e => { 
          if (e.key === 'Enter' || e.key === ' ') {
            fileInput.click(); 
          }
        });
        
        fileInput.addEventListener('change', e => {
          if (e.target.files.length > 0) {
            onFile(e.target.files[0]);
          }
        });
        
        to2.addEventListener('click', () => goStep(2));
        
        if (clearFile) {
          clearFile.addEventListener('click', () => {
            state.file = state.fileBytes = state.pdfDoc = null;
            state.numPages = 0;
            fileInput.value = '';
            renderStep1();
          });
        }

        function showError(msg) { 
          const el = $('#uploadError'); 
          el.textContent = msg; 
          el.style.display = 'block'; 
        }
      }

      async function fileToBytes(file) {
        return new Uint8Array(await file.arrayBuffer());
      }

      async function openWithPDFJS(bytes) {
        try {
          return await pdfjsLib.getDocument({ data: bytes }).promise;
        } catch (e) {
          if (e.name === 'PasswordException') {
            const pwd = prompt('यह PDF पासवर्ड-प्रोटेक्टेड है। पासवर्ड दर्ज करें:');
            if (!pwd) throw new Error('पासवर्ड नहीं दिया गया');
            return await pdfjsLib.getDocument({ data: bytes, password: pwd }).promise;
          }
          throw e;
        }
      }

      async function fallbackPageCount() {
        try {
          const doc = await PDFLib.PDFDocument.load(state.fileBytes);
          state.numPages = doc.getPageCount();
          $('#filePages').textContent = `${state.numPages} पेज`;
          $('#thumbWrap').style.display = 'none';
        } catch (e) {
          $('#uploadError').textContent = 'PDF पढ़ने में त्रुटि (पासवर्ड-प्रोटेक्टेड या दूषित?)।';
          $('#uploadError').style.display = 'block';
        }
      }

      async function renderThumbs() {
        const thumbs = $('#thumbs');
        thumbs.innerHTML = '';
        
        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'hint';
        loadingDiv.textContent = 'थंबनेल लोड हो रहे हैं...';
        thumbs.appendChild(loadingDiv);
        
        const maxThumbs = Math.min(6, state.numPages);
        
        for (let i = 1; i <= maxThumbs; i++) {
          try {
            const page = await state.pdfDoc.getPage(i);
            const viewport = page.getViewport({ scale: 0.15 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = Math.ceil(viewport.width);
            canvas.height = Math.ceil(viewport.height);
            
            await page.render({ 
              canvasContext: ctx, 
              viewport,
              intent: 'print'
            }).promise;
            
            const d = document.createElement('div');
            d.className = 'thumb';
            d.innerHTML = `<div style="font-weight:800;margin-bottom:0.375rem">पेज ${i}</div>`;
            d.appendChild(canvas);
            
            // Replace loading message with first thumbnail
            if (i === 1 && loadingDiv.parentNode) {
              thumbs.removeChild(loadingDiv);
            }
            
            thumbs.appendChild(d);
          } catch (err) {
            console.error(`Error rendering thumbnail for page ${i}:`, err);
          }
        }
        
        if (state.numPages > maxThumbs) {
          const more = document.createElement('div');
          more.className = 'hint';
          more.textContent = `(+ ${state.numPages - maxThumbs} और पेज)`;
          thumbs.appendChild(more);
        }
      }

      // Step 2: Watermark Settings
      function renderStep2() {
        if (!state.file) return renderStep1();
        setActive(2);
        panel.innerHTML = `
          <div class="grid" style="gap:1rem">
            <div class="btn-row" style="justify-content:space-between;align-items:center">
              <button class="btn ghost" id="back1">← वापस</button>
              <div class="hint">वॉटरमार्क का प्रकार चुनें</div>
            </div>
            
            <div class="option-group">
              <div class="option-group-title">वॉटरमार्क प्रकार</div>
              <div class="grid grid-2">
                <label>
                  <div class="lbl">टाइप</div>
                  <select id="watermarkType" aria-label="वॉटरमार्क प्रकार चुनें">
                    <option value="text">टेक्स्ट वॉटरमार्क</option>
                    <option value="image">इमेज वॉटरमार्क</option>
                  </select>
                </label>
                <label id="applyToLabel">
                  <div class="lbl">लागू करें</div>
                  <select id="applyTo" aria-label="किन पेजों पर लागू करें">
                    <option value="all">सभी पेज</option>
                    <option value="first">केवल पहला पेज</option>
                    <option value="last">केवल आखिरी पेज</option>
                    <option value="custom">कस्टम रेंज</option>
                  </select>
                </label>
              </div>
              <div id="pageRangeContainer" style="display:none; margin-top:10px;">
                <label>
                  <div class="lbl">पेज रेंज</div>
                  <input id="pageRange" type="text" placeholder="उदा. 1-3,5,7-" value="${state.pageRange}" aria-label="पेज रेंज दर्ज करें">
                </label>
              </div>
            </div>
            
            <div id="textWatermarkOptions">
              <div class="option-group">
                <div class="option-group-title">टेक्स्ट वॉटरमार्क</div>
                <label>
                  <div class="lbl">टेक्स्ट</div>

          const [_, a, b] = p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/);

            if (state.applyTo === 'all') {
              pagesToWatermark = pages;
            } else if (state.applyTo === 'first') {
              pagesToWatermark = [pages[0]];
            } else if (state.applyTo === 'last') {
              pagesToWatermark = [pages[pages.length - 1]];
            } else if (state.applyTo === 'custom') {
              const selectedPages = parseRange(state.pageRange, pages.length);
              pagesToWatermark = selectedPages.map(i => pages[i-1]);
            }
            
            status.textContent = `वॉटरमार्क एप्लाई किया जा रहा है (${pagesToWatermark.length} पेज)...`;
            
            // Process each page
            for (let i = 0; i < pagesToWatermark.length; i++) {
              const page = pagesToWatermark[i];
              const { width, height } = page.getSize();
              
              if (state.watermarkType === 'text') {
                // Add text watermark
                page.drawText(state.watermarkText, {
                  x: getXPosition(state.position, width),
                  y: getYPosition(state.position, height),
                  size: state.fontSize,
                  color: rgb(
                    parseInt(state.fontColor.slice(1, 3), 16) / 255,
                    parseInt(state.fontColor.slice(3, 5), 16) / 255,
                    parseInt(state.fontColor.slice(5, 7), 16) / 255
                  ),
                  opacity: state.opacity,
                  rotate: PDFLib.degrees(state.rotation)
                });
              } else {
                // Add image watermark
                if (state.watermarkImageBytes) {
                  let image;
                  const imageBytes = await fetch(state.watermarkImageBytes).then(res => res.arrayBuffer());
                  
                  if (state.watermarkImage.type.includes('png')) {
                    image = await pdfDoc.embedPng(imageBytes);
                  } else {
                    image = await pdfDoc.embedJpg(imageBytes);
                  }
                  
                  const scale = 0.3; // Scale down image
                  const imgDims = image.scale(scale);
                  
                  page.drawImage(image, {
                    x: getXPosition(state.position, width) - imgDims.width / 2,
                    y: getYPosition(state.position, height) - imgDims.height / 2,
                    width: imgDims.width,
                    height: imgDims.height,
                    opacity: state.opacity,
                    rotate: PDFLib.degrees(state.rotation)
                  });
                }
              }
              
              // Update progress
              bar.style.width = `${Math.round(((i + 1) / pagesToWatermark.length) * 100)}%`;
            }
            
            status.textContent = 'PDF सेव हो रहा है...';
            const pdfBytes = await pdfDoc.save();
            
            // Finish up
            const dt = (performance.now() - t0) / 1000;
            $('#done').style.display = 'block';
            const name = (state.file.name || 'document').replace(/\.pdf$/i, '');
            const url = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
            
            // Auto-download
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.watermarked.pdf`;
            a.click();
            
            $('#dl').href = url;
            $('#dl').download = `${name}.watermarked.pdf`;
            $('#dlRow').style.display = 'flex';
            status.innerHTML = `<span class="success">सम्पन्न • ${dt.toFixed(1)}s</span>`;
            
          } catch (e) {
            console.error(e);
            status.innerHTML = `<span class="danger">त्रुटि: ${e.message || 'वॉटरमार्क एप्लाई विफल'}</span>`;
          } finally {
            state.isProcessing = false;
          }
        }

        function getXPosition(pos, width) {
          switch(pos) {
            case 'topleft':
            case 'middleleft':
            case 'bottomleft':
              return width * 0.2;
            case 'topcenter':
            case 'center':
            case 'bottomcenter':
              return width / 2;
            case 'topright':
            case 'middleright':
            case 'bottomright':
              return width * 0.8;
            default:
              return width / 2;
          }
        }

        function getYPosition(pos, height) {
          switch(pos) {
            case 'topleft':
            case 'topcenter':
            case 'topright':
              return height * 0.8;
            case 'middleleft':
            case 'center':
            case 'middleright':
              return height / 2;
            case 'bottomleft':
            case 'bottomcenter':
            case 'bottomright':
              return height * 0.2;
            default:
              return height / 2;
          }
        }

        function parseRange(input, total) {
          if (!input || input === 'all') return Array.from({ length: total }, (_, i) => i + 1);
          const parts = input.split(/\s*,\s*/);
          const pages = new Set();
          for (const p of parts) {
            if (!p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/)) continue;
            let [_, a, b] = p.match(/^(\d+)?\s*(?:-\s*(\d+)?)?$/);
            a = a ? parseInt(a) : 1;
            b = b ? parseInt(b) : total;
            if (a > b) [a, b] = [b, a];
            for (let i = a; i <= b; i++) if (i >= 1 && i <= total) pages.add(i);
          }
          return [...pages].sort((x, y) => x - y);
        }
      }

      function setActive(step) {
        steps.forEach(el => el.classList.toggle('active', parseInt(el.dataset.step) === step));
      }

      function goStep(n) {
        switch (n) {
          case 1: renderStep1(); break;
          case 2: renderStep2(); break;
          case 3: renderStep3(); break;
          case 4: renderStep4(); break;
        }
      }

      // Initialize
      goStep(1);
    })();
  </script>
</body>
</html>
