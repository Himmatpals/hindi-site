  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #fefaf5;
      --surface: #ffffff;
      --text-primary: #1e2a3e;
      --text-secondary: #475569;
      --accent: #e66a1f;
      --accent-dark: #c2410c;
      --accent-soft: #ffedd5;
      --secondary: #1e3a8a;
      --border-light: #f1e1cf;
      --green: #12805c;
      --shadow-sm: 0 12px 30px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
      --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border-light: #334155;
      --accent-soft: #422006;
      --shadow-sm: 0 12px 30px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(230, 106, 31, 0.10), transparent 30%),
        radial-gradient(circle at top right, rgba(30, 58, 138, 0.08), transparent 28%),
        var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
      line-height: 1.5;
      transition: background 0.2s, color 0.2s;
    }

    a {
      color: inherit;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(254, 250, 245, 0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
    }

    body.dark .navbar {
      background: rgba(15, 23, 42, 0.88);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 14px 0;
      gap: 12px;
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.7rem;
      background: linear-gradient(135deg, var(--accent), #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .logo-icon {
      background: var(--accent);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: white;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 8px 18px rgba(230, 106, 31, 0.3);
    }

    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 700;
      color: var(--text-primary);
      padding: 8px 13px;
      border-radius: 40px;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .nav-links a:hover,
    .voice-btn {
      background: var(--accent);
      color: white !important;
    }

    .voice-btn {
      background: var(--accent);
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 12px rgba(230,106,31,0.3);
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      border-radius: 40px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: var(--transition);
    }

    .mobile-menu {
      display: none;
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .hero {
      padding: 56px 0 36px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge {
      background: var(--accent-soft);
      padding: 6px 14px;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-dark);
    }

    body.dark .badge {
      color: #fed7aa;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 18px;
      letter-spacing: -0.04em;
    }

    .highlight {
      color: var(--accent);
    }

    .hero-text {
      color: var(--text-secondary);
      font-size: 1.15rem;
      max-width: 680px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 28px;
    }

    .btn-primary,
    .btn-secondary {
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 800;
      text-decoration: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 18px rgba(230,106,31,0.25);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .voice-card {
      background: var(--surface);
      border-radius: 32px;
      padding: 28px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .voice-card p {
      color: var(--text-secondary);
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border-light);
      background: var(--bg);
      border-radius: 60px;
      font-size: 1rem;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(230, 106, 31, 0.12);
    }

    .tools-section {
      padding: 48px 0;
    }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.03em;
    }

    .section-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 28px 0 24px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tab {
      background: var(--surface);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .tab.active,
    .tab:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 16px;
    }

    .tool-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 22px;
      border: 1px solid var(--border-light);
      transition: var(--transition);
      text-decoration: none;
      color: inherit;
      display: block;
      min-height: 210px;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .tool-icon {
      font-size: 2.4rem;
      margin-bottom: 14px;
    }

    .tool-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    body.dark .tool-tag {
      color: #fed7aa;
    }

    .tool-card h3 {
      font-size: 1.4rem;
      margin: 8px 0 4px;
    }

    .tool-card p {
      color: var(--text-secondary);
    }

    .stats {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 12px;
      font-weight: 700;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
      gap: 28px;
      margin-top: 48px;
    }

    .feature-item {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .feature-item h3 {
      margin-bottom: 8px;
    }

    .feature-item p {
      color: var(--text-secondary);
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border-light);
      padding: 44px 0 24px;
      margin-top: 48px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 32px;
      align-items: start;
    }

    .footer-title {
      font-size: 1.5rem;
      font-weight: 800;
      display: block;
      margin-bottom: 8px;
    }

    .footer-text {
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .footer-links {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 600;
    }

    .footer-links a:hover {
      color: var(--accent);
      transform: translateX(2px);
    }

    .copyright {
      border-top: 1px solid var(--border-light);
      margin-top: 32px;
      padding-top: 18px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .no-results {
      text-align: center;
      padding: 48px;
      background: var(--surface);
      border-radius: 40px;
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: 22px;
        padding: 14px;
        box-shadow: var(--shadow-sm);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        text-align: center;
      }

      .mobile-menu {
        display: block;
      }

      .theme-toggle {
        margin-left: auto;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 0 16px;
      }

      .hero {
        padding-top: 36px;
      }

      .voice-card {
        border-radius: 24px;
        padding: 22px;
      }

      .filter-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .search-input {
        max-width: none !important;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-primary,
      .btn-secondary {
        justify-content: center;
      }
    }
  </style>
</head>
